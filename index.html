        async function handlePhoneFilesSelected(fileList) {
            const files = Array.from(fileList || []).filter(f =>
                (f.type && f.type.startsWith('audio/')) || /\.(mp3|wav|m4a|ogg|aac|flac)$/i.test(f.name)
            );

            if (files.length === 0) {
                showLCDToast('FILE BUKAN AUDIO');
                triggerHaptic([30, 40, 30]);
                return;
            }

            supabaseStore.isUploading = true;
            let cloudSuccessCount = 0;
            let localFallbackCount = 0;

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                supabaseStore.uploadStatus = `${i + 1}/${files.length}`;
                showLCDToast(`UPLOAD ${i + 1}/${files.length}...`, 4000);
                renderLCDScreen();

                const safeFileName = sanitizeUploadFilename(file.name);
                const storagePath = `${SUPABASE_CONFIG.folder}/${safeFileName}`;
                let uploadedToCloud = false;

                if (supabaseClient) {
                    try {
                        const { error } = await supabaseClient.storage
                            .from(SUPABASE_CONFIG.bucket)
                            .upload(storagePath, file, {
                                cacheControl: '3600',
                                upsert: true,
                                contentType: file.type || 'audio/mpeg'
                            });

                        if (!error) {
                            uploadedToCloud = true;
                            cloudSuccessCount++;
                        }
                    } catch (err) {
                        console.warn('Upload cloud gagal, fallback ke memori perangkat:', err);
                    }
                }

                if (!uploadedToCloud) {
                    const blobUrl = URL.createObjectURL(file);
                    const meta = parseTrackMetadata(file.name, 'LOKAL HP');
                    supabaseStore.localTracks.push({
                        id: `HP-${Date.now()}-${i}`,
                        fileName: file.name,
                        title: meta.title,
                        artist: 'MEMORI PONSEL',
                        folder: 'LOKAL HP',
                        duration: 0,
                        audioUrl: blobUrl
                    });
                    if (!supabaseStore.folders.includes('LOKAL HP')) {
                        supabaseStore.folders.push('LOKAL HP');
                    }
                    localFallbackCount++;
                }
            }

            supabaseStore.isUploading = false;
            supabaseStore.uploadStatus = 'PILIH';

            if (cloudSuccessCount > 0) {
                await syncSupabaseData();
            } else {
                state.currentQueue = getAllTracks();
                renderLCDScreen();
            }

            triggerHaptic([20, 40, 20]);
            if (cloudSuccessCount > 0 && localFallbackCount === 0) {
                showLCDToast(`${cloudSuccessCount} LAGU TERUNGGAH!`, 2000);
            } else if (cloudSuccessCount > 0 && localFallbackCount > 0) {
                showLCDToast(`${cloudSuccessCount} CLOUD, ${localFallbackCount} HP`, 2200);
            } else {
                showLCDToast(`${localFallbackCount} LAGU HP DITAMBAH`, 2200);
            }
        }

        if (audioUploadInputEl) {
            audioUploadInputEl.addEventListener('change', (e) => {
                if (e.target.files && e.target.files.length > 0) {
                    handlePhoneFilesSelected(e.target.files);
                }
            });
        }

        async function syncSupabaseData() {
            if (!supabaseClient) {
                supabaseStore.connected = false;
                supabaseStore.statusLabel = 'LOKAL';
                supabaseStore.cloudTracks = [];
                supabaseStore.folders = supabaseStore.localTracks.length > 0 ? ['LOKAL HP'] : [];
                state.currentQueue = getAllTracks();
                if (state.currentQueue.length === 0) state.currentTrackIndex = 0;
                renderLCDScreen();
                return;
            }

            try {
                const [storageRes, notesRes, remRes] = await Promise.allSettled([
                    supabaseClient.storage
                        .from(SUPABASE_CONFIG.bucket)
                        .list(SUPABASE_CONFIG.folder, {
                            limit: 100,
                            offset: 0,
                            sortBy: { column: 'name', order: 'asc' }
                        }),
                    supabaseClient.from('catatan').select('*').order('id', { ascending: false }).limit(50),
                    supabaseClient.from('pengingat').select('*').order('id', { ascending: false }).limit(50)
                ]);

                const collectedTracks = [];
                const detectedFolders = new Set();

                if (storageRes.status === 'fulfilled' && !storageRes.value.error && Array.isArray(storageRes.value.data)) {
                    const entries = storageRes.value.data;

                    entries
                        .filter(item => item && item.name && /\.(mp3|wav|m4a|ogg|aac|flac)$/i.test(item.name))
                        .forEach(file => {
                            const urlData = supabaseClient.storage
                                .from(SUPABASE_CONFIG.bucket)
                                .getPublicUrl(`${SUPABASE_CONFIG.folder}/${file.name}`);
                            const meta = parseTrackMetadata(file.name, 'UTAMA');
                            collectedTracks.push({
                                id: `SB-${collectedTracks.length + 1}`,
                                fileName: file.name,
                                title: meta.title,
                                artist: meta.artist,
                                folder: 'UTAMA',
                                duration: 0,
                                audioUrl: urlData?.data?.publicUrl || ''
                            });
                        });

                    const subfolders = entries.filter(item => item && item.name && !item.id && !/\./.test(item.name));
                    if (subfolders.length > 0) {
                        const subResults = await Promise.allSettled(
                            subfolders.map(sf =>
                                supabaseClient.storage
                                    .from(SUPABASE_CONFIG.bucket)
                                    .list(`${SUPABASE_CONFIG.folder}/${sf.name}`, {
                                        limit: 100,
                                        sortBy: { column: 'name', order: 'asc' }
                                    })
                                    .then(res => ({ folderName: sf.name, res }))
                            )
                        );

                        subResults.forEach(sr => {
                            if (sr.status === 'fulfilled' && !sr.value.res.error && Array.isArray(sr.value.res.data)) {
                                const fName = sr.value.folderName.toUpperCase();
                                const subFiles = sr.value.res.data.filter(f => f && f.name && /\.(mp3|wav|m4a|ogg|aac|flac)$/i.test(f.name));
                                if (subFiles.length > 0) detectedFolders.add(fName);
                                subFiles.forEach(file => {
                                    const urlData = supabaseClient.storage
                                        .from(SUPABASE_CONFIG.bucket)
                                        .getPublicUrl(`${SUPABASE_CONFIG.folder}/${sr.value.folderName}/${file.name}`);
                                    const meta = parseTrackMetadata(file.name, fName);
                                    collectedTracks.push({
                                        id: `SB-${collectedTracks.length + 1}`,
                                        fileName: file.name,
                                        title: meta.title,
                                        artist: meta.artist,
                                        folder: fName,
                                        duration: 0,
                                        audioUrl: urlData?.data?.publicUrl || ''
                                    });
                                });
                            }
                        });
                    }
                }

                if (supabaseStore.localTracks.length > 0) {
                    detectedFolders.add('LOKAL HP');
                }

                supabaseStore.cloudTracks = collectedTracks;
                supabaseStore.folders = Array.from(detectedFolders);

                if (notesRes.status === 'fulfilled' && !notesRes.value.error && Array.isArray(notesRes.value.data)) {
                    supabaseStore.notes = sortNewestFirst(notesRes.value.data);
                }

                if (remRes.status === 'fulfilled' && !remRes.value.error && Array.isArray(remRes.value.data)) {
                    supabaseStore.reminders = sortNewestFirst(remRes.value.data);
                }

                const anySuccess =
                    (storageRes.status === 'fulfilled' && !storageRes.value.error) ||
                    (notesRes.status === 'fulfilled' && !notesRes.value.error) ||
                    (remRes.status === 'fulfilled' && !remRes.value.error);

                supabaseStore.connected = anySuccess;
                supabaseStore.statusLabel = anySuccess ? 'TERHUBUNG' : 'OFFLINE';
            } catch (err) {
                supabaseStore.connected = false;
                supabaseStore.statusLabel = 'OFFLINE';
                supabaseStore.cloudTracks = [];
                supabaseStore.folders = supabaseStore.localTracks.length > 0 ? ['LOKAL HP'] : [];
            }

            state.currentQueue = getAllTracks();
            if (state.currentQueue.length === 0) {
                state.currentTrackIndex = 0;
            } else {
                if (!synth.currentSong && state.savedTrackId) {
                    const foundIdx = state.currentQueue.findIndex(t => t.id === state.savedTrackId);
                    if (foundIdx !== -1) {
                        state.currentTrackIndex = foundIdx;
                        synth.loadSongWithoutPlay(state.currentQueue[foundIdx], state.savedElapsed);
                    }
                } else if (state.currentTrackIndex >= state.currentQueue.length) {
                    state.currentTrackIndex = 0;
                }
            }
            renderLCDScreen();
        }

        function currentView() {
            return state.navStack[state.navStack.length - 1];
        }

        function isNowPlayingActive() {
            return currentView().type === 'now-playing';
        }

        function formatCalcTime(sec) {
            const s = Math.max(0, Math.floor(sec));
            const m = Math.floor(s / 60);
            const r = s % 60;
            return `${m < 10 ? '0' : ''}${m}:${r < 10 ? '0' : ''}${r}`;
        }

        function padTwo(num) {
            return num < 10 ? `0${num}` : `${num}`;
        }

        function paginateNokiaText(text, charsPerPage = 240) {
            const clean = (text || '(Kosong)').trim();
            if (!clean) return ['(Kosong)'];

            const lines = clean.split('\n');
            const pages = [];
            let current = '';

            for (const line of lines) {
                const words = line.split(' ');
                for (let w = 0; w < words.length; w++) {
                    const word = words[w];
                    const sep = current.length === 0 || current.endsWith('\n') ? '' : ' ';
                    if ((current + sep + word).length > charsPerPage && current.length > 0) {
                        pages.push(current.trimEnd());
                        current = word;
                    } else {
                        current += sep + word;
                    }
                }
                if (current.length + 1 <= charsPerPage) {
                    current += '\n';
                } else {
                    pages.push(current.trimEnd());
                    current = '';
                }
            }

            if (current.trim().length > 0) {
                pages.push(current.trimEnd());
            }
            return pages.length > 0 ? pages : ['(Kosong)'];
        }

        function buildTrackListMenu(title, tracks) {
            const trackItems = tracks.length > 0
                ? tracks.map((trk, idx) => ({
                    label: `${padTwo(idx + 1)}. ${trk.title}`,
                    rightText: trk.duration > 0 ? formatCalcTime(trk.duration) : 'AUDIO',
                    action: 'play-track',
                    queue: tracks,
                    trackIndex: idx
                }))
                : [{
                    label: 'BELUM ADA AUDIO DI FOLDER INI',
                    rightText: 'KOSONG',
                    action: 'detail-page',
                    detailTitle: title,
                    pages: [`Status: ${supabaseStore.statusLabel}\nUnggah lagu lewat menu PENGATURAN -> 08. UPLOAD LAGU.`]
                }];

            return {
                id: `tracks-${title}`,
                title,
                type: 'menu',
                selectedIndex: 0,
                items: [
                    ...(tracks.length > 0 ? [{ label: 'PUTAR ACAK DAFTAR INI', action: 'shuffle-play', queue: tracks }] : []),
                    ...trackItems
                ]
            };
        }

        function buildSubmenu(target) {
            const allTracks = getAllTracks();

            if (target === 'music') {
                if (supabaseStore.folders.length === 0) {
                    return buildTrackListMenu('MUSIK SUPABASE', allTracks);
                }

                const folderItems = supabaseStore.folders.map(fName => {
                    const count = allTracks.filter(t => t.folder === fName).length;
                    return {
                        label: `FOLDER: ${fName}`,
                        rightText: `${count} TRK`,
                        action: 'folder-tracks',
                        folderName: fName
                    };
                });

                return {
                    id: 'music-folders',
                    title: 'MUSIK SUPABASE',
                    type: 'menu',
                    selectedIndex: 0,
                    items: [
                        { label: '01. SEMUA LAGU', rightText: `${allTracks.length} TRK`, action: 'all-tracks' },
                        ...folderItems
                    ]
                };
            }

            if (target === 'notes') {
                const orderedNotes = sortNewestFirst(supabaseStore.notes);
                const items = orderedNotes.length > 0
                    ? orderedNotes.map((n, i) => {
                        const noteTitle = (n.title || n.tittle || 'CATATAN').toUpperCase();
                        return {
                            label: `${padTwo(i + 1)}. ${noteTitle}`,
                            rightText: 'BACA',
                            action: 'detail-page',
                            detailTitle: noteTitle,
                            pages: paginateNokiaText(n.description || '(Kosong)')
                        };
                    })
                    : [{
                        label: 'TIDAK ADA CATATAN / OFFLINE',
                        rightText: 'INFO',
                        action: 'detail-page',
                        detailTitle: 'INFO CATATAN',
                        pages: [`Status: ${supabaseStore.statusLabel}\nBelum ada data catatan yang dimuat.`]
                    }];
                return { id: 'notes', title: 'CATATAN', type: 'menu', selectedIndex: 0, items };
            }

            if (target === 'reminders') {
                const orderedReminders = sortNewestFirst(supabaseStore.reminders);
                const items = orderedReminders.length > 0
                    ? orderedReminders.map((r, i) => ({
                        label: `${padTwo(i + 1)}. ${r.is_completed ? '[V] ' : '[ ] '}${(r.content || 'PENGINGAT').toUpperCase()}`,
                        rightText: r.reminder_time ? r.reminder_time.substring(0, 5) : '--:--',
                        action: 'reminder-detail',
                        reminderIndex: i
                    }))
                    : [{
                        label: 'TIDAK ADA PENGINGAT / OFFLINE',
                        rightText: 'INFO',
                        action: 'detail-page',
                        detailTitle: 'INFO PENGINGAT',
                        pages: [`Status: ${supabaseStore.statusLabel}\nBelum ada jadwal pengingat.`]
                    }];
                return { id: 'reminders', title: 'PENGINGAT', type: 'menu', selectedIndex: 0, items };
            }

            if (target === 'settings') {
                return {
                    id: 'settings',
                    title: 'PENGATURAN',
                    type: 'menu',
                    selectedIndex: 0,
                    items: [
                        { label: '01. CAHAYA LCD', action: 'cycle-theme', getVal: () => THEME_NAMES[LCD_THEMES[state.themeIndex]] },
                        { label: '02. MODE MALAM', action: 'toggle-night', getVal: () => state.nightMode ? 'AKTIF' : 'MATI' },
                        { label: '03. KUNCI HOLD', action: 'toggle-hold', allowWhenLocked: true, getVal: () => state.isLocked ? 'AKTIF' : 'MATI' },
                        { label: '04. MODE ULANGI', action: 'cycle-repeat', getVal: () => REPEAT_NAMES[state.repeatMode] },
                        { label: '05. ACAK LAGU', action: 'toggle-shuffle', getVal: () => state.shuffle ? 'AKTIF' : 'MATI' },
                        { label: '06. SUARA KLIK', action: 'toggle-click', getVal: () => synth.clickEnabled ? 'AKTIF' : 'MATI' },
                        { label: '07. SINKRON SUPABASE', action: 'sync-supabase', getVal: () => supabaseStore.statusLabel },
                        { label: '08. UPLOAD LAGU (HP)', action: 'upload-audio', getVal: () => supabaseStore.uploadStatus }
                    ]
                };
            }

            return null;
        }

        const lcdHeaderTitleEl = document.getElementById('lcdHeaderTitle');
        const lcdScreenBodyEl = document.getElementById('lcdScreenBody');
        const lcdVolIndicatorEl = document.getElementById('lcdVolIndicator');
        const lcdTrackCounterEl = document.getElementById('lcdTrackCounter');
        const lcdFooterLeftEl = document.getElementById('lcdFooterLeft');
        const lcdFooterRightEl = document.getElementById('lcdFooterRight');
        const lcdToastEl = document.getElementById('lcdToast');
        const badgePlayEl = document.getElementById('badgePlay');
        const badgeHoldEl = document.getElementById('badgeHold');
        const badgeShuffleEl = document.getElementById('badgeShuffle');
        const badgeRepeatEl = document.getElementById('badgeRepeat');

        let toastTimeout = null;
        function showLCDToast(msg, duration = 1600) {
            lcdToastEl.textContent = msg;
            lcdToastEl.classList.remove('hidden');
            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                lcdToastEl.classList.add('hidden');
            }, duration);
        }

        function updateStatusAnnunciators() {
            const view = currentView();
            lcdHeaderTitleEl.textContent = view.title;

            if (synth.isPlaying) {
                badgePlayEl.textContent = 'PUTAR ▶';
                badgePlayEl.className = 'lcd-badge';
            } else if (synth.currentSong) {
                badgePlayEl.textContent = 'JEDA ❚❚';
                badgePlayEl.className = 'lcd-badge';
            } else {
                badgePlayEl.textContent = 'SIAP';
                badgePlayEl.className = 'lcd-badge';
            }

            badgeHoldEl.className = state.isLocked ? 'lcd-badge' : 'lcd-badge ghost';
            badgeShuffleEl.className = state.shuffle ? 'lcd-badge' : 'lcd-badge ghost';

            if (state.repeatMode === 'one') {
                badgeRepeatEl.textContent = 'RPT-1';
                badgeRepeatEl.className = 'lcd-badge';
            } else if (state.repeatMode === 'all') {
                badgeRepeatEl.textContent = 'RPT-A';
                badgeRepeatEl.className = 'lcd-badge';
            } else {
                badgeRepeatEl.textContent = 'RPT';
                badgeRepeatEl.className = 'lcd-badge ghost';
            }

            const volPct = Math.round(synth.volume * 100);
            lcdVolIndicatorEl.textContent = `VOL:${padTwo(volPct)}`;
            const qLen = Math.max(1, state.currentQueue.length);
            const curNum = state.currentQueue.length > 0 ? state.currentTrackIndex + 1 : 0;
            lcdTrackCounterEl.textContent = `TRK ${padTwo(curNum)}/${padTwo(qLen)}`;

            if (view.type === 'detail-page') {
                lcdFooterLeftEl.textContent = '[WHEEL] HALAMAN';
                lcdFooterRightEl.textContent = '[MENU] KEMBALI';
            } else if (view.type === 'reminder-detail') {
                lcdFooterLeftEl.textContent = '[MENU] KEMBALI';
                lcdFooterRightEl.textContent = '[TENGAH] UBAH STATUS';
            } else if (view.type === 'now-playing') {
                lcdFooterLeftEl.textContent = state.wheelMode === 'seek' ? '[WHEEL] GESER ±5S' : '[WHEEL] VOLUME';
                lcdFooterRightEl.textContent = '[TENGAH] MODE RODA';
            } else {
                lcdFooterLeftEl.textContent = '[WHEEL] GULIR';
                lcdFooterRightEl.textContent = '[TENGAH] PILIH';
            }
        }

        function syncMenuSelectionDOM(view) {
            const scrollContainer = document.getElementById('calcListScroll');
            if (!scrollContainer) {
                renderLCDScreen();
                return;
            }
            const rows = scrollContainer.querySelectorAll('.calc-menu-row');
            if (rows.length !== view.items.length) {
                renderLCDScreen();
                return;
            }
            rows.forEach((row, idx) => {
                const isActive = idx === view.selectedIndex;
                row.classList.toggle('active', isActive);
                const iconSpan = row.querySelector('.calc-row-icon');
                if (iconSpan) {
                    const item = view.items[idx];
                    const isCurrentlyPlaying = item && item.action === 'play-track' &&
                        synth.currentSong &&
                        item.queue[item.trackIndex] &&
                        item.queue[item.trackIndex].id === synth.currentSong.id;
                    iconSpan.textContent = isActive ? '▶' : (isCurrentlyPlaying ? '♪' : ' ');
                }
            });
            const activeRow = rows[view.selectedIndex];
            if (activeRow) {
                const rowTop = activeRow.offsetTop;
                const rowBottom = rowTop + activeRow.offsetHeight;
                const viewTop = scrollContainer.scrollTop;
                const viewBottom = viewTop + scrollContainer.clientHeight;
                if (rowTop < viewTop) {
                    scrollContainer.scrollTop = rowTop;
                } else if (rowBottom > viewBottom) {
                    scrollContainer.scrollTop = rowBottom - scrollContainer.clientHeight;
                }
            }
        }

        function renderLCDScreen() {
            updateStatusAnnunciators();
            const view = currentView();

            if (view.type === 'menu') {
                const rowsHTML = view.items.map((item, idx) => {
                    const isActive = idx === view.selectedIndex;
                    const valueTag = item.getVal ? item.getVal() : (item.rightText || '');
                    const isCurrentlyPlaying = item.action === 'play-track' &&
                        synth.currentSong &&
                        item.queue[item.trackIndex] &&
                        item.queue[item.trackIndex].id === synth.currentSong.id;

                    return `
                        <div class="calc-menu-row ${isActive ? 'active' : ''}" data-idx="${idx}">
                            <div class="calc-menu-label-wrap">
                                <span class="calc-row-icon shrink-0">${isActive ? '▶' : (isCurrentlyPlaying ? '♪' : ' ')}</span>
                                <span class="calc-menu-text">${item.label}</span>
                            </div>
                            <div class="shrink-0 font-calc-digit text-xs sm:text-sm">
                                ${valueTag ? `[${valueTag}]` : '&gt;'}
                            </div>
                        </div>
                    `;
                }).join('');

                lcdScreenBodyEl.innerHTML = `
                    <div id="calcListScroll" class="flex-1 overflow-y-auto no-scrollbar">
                        ${rowsHTML}
                    </div>
                `;

                const scrollContainer = document.getElementById('calcListScroll');
                const activeRow = scrollContainer?.querySelector('.calc-menu-row.active');
                if (activeRow) {
                    scrollContainer.scrollTop = Math.max(0, activeRow.offsetTop - 4);
                }
                return;
            }

            if (view.type === 'detail-page') {
                const totalPages = Math.max(1, view.pages.length);
                const curPage = Math.max(0, Math.min(totalPages - 1, view.pageIndex || 0));
                view.pageIndex = curPage;
                const pageContent = view.pages[curPage] || '(Kosong)';

                let dotsHTML = '';
                for (let p = 0; p < totalPages; p++) {
                    dotsHTML += `<span class="inline-block w-2 h-1.5 ${p === curPage ? 'bg-current' : 'bg-current/25'}"></span>`;
                }

                lcdScreenBodyEl.innerHTML = `
                    <div class="nokia-reader-shell">
                        <div class="nokia-reader-header">
                            <span class="font-calc-digit text-[11px] font-bold uppercase truncate pr-2">
                                ${view.detailTitle || 'CATATAN'}
                            </span>
                            <span class="font-calc-digit text-[10px] font-bold shrink-0 px-1 border border-current">
                                HAL ${padTwo(curPage + 1)}/${padTwo(totalPages)}
                            </span>
                        </div>

                        <div class="nokia-reader-body-slot">
                            <div class="nokia-page-body">${pageContent}</div>
                        </div>

                        <div class="nokia-reader-footer">
                            <span class="font-calc-digit text-[10px]">
                                ${curPage > 0 ? '◀ SEBELUMNYA' : 'AWAL HALAMAN'}
                            </span>
                            <div class="flex items-center gap-1">${dotsHTML}</div>
                            <span class="font-calc-digit text-[10px]">
                                ${curPage < totalPages - 1 ? 'LANJUT ▶' : 'AKHIR HALAMAN'}
                            </span>
                        </div>
                    </div>
                `;
                return;
            }

            if (view.type === 'reminder-detail') {
                const orderedReminders = sortNewestFirst(supabaseStore.reminders);
                const rem = orderedReminders[view.reminderIndex];
                if (!rem) {
                    lcdScreenBodyEl.innerHTML = `<div class="p-4 font-calc-matrix text-2xl">DATA TIDAK DITEMUKAN</div>`;
                    return;
                }
                const statusText = rem.is_completed ? '[V] SUDAH SELESAI' : '[ ] BELUM SELESAI';
                lcdScreenBodyEl.innerHTML = `
                    <div class="flex-1 flex flex-col justify-between p-2.5 sm:p-3.5 overflow-hidden">
                        <div class="lcd-divider-b pb-1 mb-1.5 flex items-center justify-between">
                            <span class="font-calc-digit text-xs font-bold">PENGINGAT #${padTwo(view.reminderIndex + 1)}</span>
                            <span class="font-calc-digit text-[10px] px-1.5 py-0.5 border border-current font-bold">
                                ${rem.is_completed ? 'SELESAI' : 'AKTIF'}
                            </span>
                        </div>

                        <div class="my-auto space-y-1.5">
                            <div class="font-calc-matrix text-2xl sm:text-3xl font-bold leading-tight">
                                ${rem.content || '-'}
                            </div>
                            <div class="font-calc-digit text-xs opacity-85">
                                TANGGAL: ${rem.reminder_date || '-'} | JAM: ${rem.reminder_time ? rem.reminder_time.substring(0, 5) : '--:--'}
                            </div>
                        </div>

                        <div class="pt-2 lcd-divider-t flex items-center justify-between">
                            <span class="font-calc-digit text-xs font-bold">${statusText}</span>
                            <span class="font-calc-digit text-[10px] px-1.5 py-0.5 bg-current text-[var(--lcd-bg)] font-bold">
                                KLIK TENGAH = UBAH
                            </span>
                        </div>
                    </div>
                `;
                return;
            }

            if (view.type === 'now-playing') {
                const song = synth.currentSong || state.currentQueue[state.currentTrackIndex] || null;
                if (!song) {
                    lcdScreenBodyEl.innerHTML = `
                        <div class="flex-1 flex flex-col items-center justify-center p-3 text-center">
                            <div class="font-calc-matrix text-2xl sm:text-3xl font-bold">TIDAK ADA LAGU</div>
                            <div class="font-calc-digit text-xs opacity-80 mt-1">
                                UNGGAH LAGU DI PENGATURAN
                            </div>
                        </div>
                    `;
                    return;
                }

                const elapsedStr = formatCalcTime(synth.elapsed);
                const totalStr = song.duration > 0 ? formatCalcTime(song.duration) : '--:--';
                const safeDur = song.duration > 0 ? song.duration : 0;
                const filledCells = safeDur > 0
                    ? Math.min(20, Math.max(0, Math.round((synth.elapsed / safeDur) * 20)))
                    : (synth.isPlaying ? Math.max(1, (synth.stepIndex % 20) + 1) : 0);

                let progressCellsHTML = '';
                for (let i = 0; i < 20; i++) {
                    progressCellsHTML += `<div class="calc-bar-cell ${i < filledCells ? 'filled' : ''}"></div>`;
                }

                const spectrumHTML = synth.spectrumLevels.map(lvl => {
                    let blocks = '';
                    for (let b = 8; b >= 1; b--) {
                        const on = synth.isPlaying && b <= lvl;
                        blocks += `<div class="h-[3px] w-full ${on ? 'bg-current' : 'bg-current/10'}"></div>`;
                    }
                    return `<div class="flex-1 flex flex-col gap-[1.5px]">${blocks}</div>`;
                }).join('');

                const wheelBadge = state.wheelMode === 'seek'
                    ? 'RODA: GESER WAKTU (±5 DETIK)'
                    : `RODA: VOLUME (${Math.round(synth.volume * 100)}%)`;

                lcdScreenBodyEl.innerHTML = `
                    <div class="flex-1 flex flex-col justify-between p-2.5 sm:p-3.5">
                        <div class="flex items-start justify-between gap-2 lcd-divider-b pb-1.5">
                            <div class="min-w-0 flex-1">
                                <div class="font-calc-matrix text-2xl sm:text-3xl leading-none font-bold truncate">
                                    ${song.title}
                                </div>
                                <div class="font-calc-digit text-[10px] sm:text-xs opacity-85 mt-1 truncate">
                                    ARTIS: ${song.artist}
                                </div>
                            </div>
                            <div class="w-20 sm:w-24 flex gap-[2px] p-1 lcd-box-border shrink-0" title="Spektrum Audio">
                                ${spectrumHTML}
                            </div>
                        </div>

                        <div class="my-auto flex flex-col items-end justify-center py-1">
                            <div class="text-[9px] font-calc-digit uppercase tracking-widest opacity-75">
                                WAKTU BERJALAN / TOTAL
                            </div>
                            <div class="flex items-baseline gap-2">
                                <div class="digit-stack font-calc-digit text-3xl sm:text-5xl font-black leading-none">
                                    <span class="digit-ghost">88:88</span>
                                    <span id="calcElapsedDigits" class="digit-active">${elapsedStr}</span>
                                </div>
                                <span class="font-calc-digit text-base sm:text-xl opacity-75">/ ${totalStr}</span>
                            </div>
                        </div>

                        <div>
                            <div id="calcProgressCells" class="calc-bar-container">
                                ${progressCellsHTML}
                            </div>
                            <div class="flex justify-between items-center mt-1 text-[9px] sm:text-[10px] font-calc-digit">
                                <span>${song.folder || 'SUPABASE'}</span>
                                <span class="font-bold">${wheelBadge}</span>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        synth.onTick = () => {
            if (isNowPlayingActive()) {
                renderLCDScreen();
            } else {
                updateStatusAnnunciators();
            }
        };

        synth.onSongFinish = () => {
            const pool = state.currentQueue.length > 0 ? state.currentQueue : getAllTracks();
            if (pool.length === 0) return;

            if (state.repeatMode === 'one') {
                startTrackAt(state.currentTrackIndex, pool);
                return;
            }

            if (!state.shuffle && state.repeatMode === 'off' && state.currentTrackIndex >= pool.length - 1) {
                synth.isPlaying = false;
                synth.stopProgressTimer();
                renderLCDScreen();
                return;
            }

            nextTrack(true);
        };

        const IDLE_SCREENSAVER_MS = 15000;
        let idleScreensaverTimer = null;

        function wakeFromScreensaver() {
            const wasSleeping = document.body.classList.contains('screensaver-mode');
            document.body.classList.remove('screensaver-mode');
            if (wasSleeping) {
                synth.playClick(1.0, 'wake');
            }
            if (idleScreensaverTimer) clearTimeout(idleScreensaverTimer);
            idleScreensaverTimer = setTimeout(() => {
                document.body.classList.add('screensaver-mode');
                synth.playClick(1.0, 'sleep');
            }, IDLE_SCREENSAVER_MS);
        }

        function startTrackAt(index, queue = null, startPos = 0) {
            const list = (queue && queue.length > 0) ? queue : getAllTracks();
            if (!list || list.length === 0) {
                state.currentQueue = [];
                state.currentTrackIndex = 0;
                synth.playSong(null);
                renderLCDScreen();
                return;
            }
            state.currentQueue = list;
            const len = state.currentQueue.length;
            state.currentTrackIndex = ((index % len) + len) % len;
            const song = state.currentQueue[state.currentTrackIndex];
            synth.playSong(song, startPos);
            savePersistentState();
            renderLCDScreen();
        }

        function guardHoldLock() {
            if (!state.isLocked) return false;
            synth.playClick(0.7, 'wheel');
            triggerHaptic([20, 30, 20]);
            showLCDToast(isNowPlayingActive()
                ? '[TERKUNCI - TAHAN MENU UNTUK BUKA]'
                : '[TERKUNCI - BUKA DI NOW PLAYING]');
            return true;
        }

        function nextTrack(fromAuto = false) {
            if (!fromAuto && guardHoldLock()) return;
            const pool = state.currentQueue.length > 0 ? state.currentQueue : getAllTracks();
            if (pool.length === 0) return;
            if (!fromAuto) {
                synth.playClick(1.12, 'wheel');
                triggerHaptic(10);
            }
            if (state.shuffle && pool.length > 1) {
                let next = Math.floor(Math.random() * pool.length);
                if (next === state.currentTrackIndex) next = (next + 1) % pool.length;
                startTrackAt(next, pool);
            } else {
                startTrackAt(state.currentTrackIndex + 1, pool);
            }
        }

        function prevTrack() {
            if (guardHoldLock()) return;
            const pool = state.currentQueue.length > 0 ? state.currentQueue : getAllTracks();
            if (pool.length === 0) return;
            synth.playClick(0.95, 'wheel');
            triggerHaptic(10);
            if (synth.elapsed > 3) {
                synth.seekBy(-synth.elapsed);
                renderLCDScreen();
            } else {
                startTrackAt(state.currentTrackIndex - 1, pool);
            }
        }

        function cycleLCDTheme() {
            state.themeIndex = (state.themeIndex + 1) % LCD_THEMES.length;
            document.body.setAttribute('data-lcd-theme', LCD_THEMES[state.themeIndex]);
            synth.playClick(1.15, 'wheel');
            savePersistentState();
            renderLCDScreen();
        }

        function toggleNightMode() {
            state.nightMode = !state.nightMode;
            document.body.setAttribute('data-night-mode', state.nightMode ? 'true' : 'false');
            synth.playClick(state.nightMode ? 1.18 : 0.92, 'wheel');
            savePersistentState();
            renderLCDScreen();
        }

        function toggleHoldLock() {
            state.isLocked = !state.isLocked;
            synth.playClick(1.0, state.isLocked ? 'sleep' : 'wake');
            triggerHaptic(state.isLocked ? [25, 35, 25] : 20);
            showLCDToast(state.isLocked ? 'KUNCI HOLD: AKTIF' : 'KUNCI HOLD: MATI', 1300);
            renderLCDScreen();
        }

        function cycleRepeatMode() {
            const idx = REPEAT_MODES.indexOf(state.repeatMode);
            state.repeatMode = REPEAT_MODES[(idx + 1) % REPEAT_MODES.length];
            synth.playClick(1.1, 'wheel');
            savePersistentState();
            renderLCDScreen();
        }

        async function toggleReminderCompleted(reminderIndex) {
            const orderedReminders = sortNewestFirst(supabaseStore.reminders);
            const rem = orderedReminders[reminderIndex];
            if (!rem) return;

            const nextVal = !rem.is_completed;
            rem.is_completed = nextVal;
            synth.playClick(1.0, 'enter');
            renderLCDScreen();

            if (supabaseClient && rem.id !== undefined) {
                const { error } = await supabaseClient
                    .from('pengingat')
                    .update({ is_completed: nextVal })
                    .eq('id', rem.id);

                if (error) {
                    rem.is_completed = !nextVal;
                    showLCDToast('GAGAL UPDATE SUPABASE');
                    renderLCDScreen();
                } else {
                    showLCDToast(nextVal ? 'DITANDAI SELESAI' : 'DITANDAI AKTIF', 1200);
                }
            }
        }

        function handleWheelStep(dir) {
            if (guardHoldLock()) return;
            const view = currentView();

            if (view.type === 'menu') {
                const next = view.selectedIndex + dir;
                if (next >= 0 && next < view.items.length) {
                    view.selectedIndex = next;
                    synth.playClick(dir > 0 ? 1.06 : 0.96, 'wheel');
                    syncMenuSelectionDOM(view);
                }
            } else if (view.type === 'detail-page') {
                const nextP = (view.pageIndex || 0) + dir;
                if (nextP >= 0 && nextP < view.pages.length) {
                    view.pageIndex = nextP;
                    synth.playClick(dir > 0 ? 1.08 : 0.94, 'wheel');
                    renderLCDScreen();
                }
            } else if (view.type === 'now-playing') {
                if (state.wheelMode === 'seek') {
                    synth.seekBy(dir * 5);
                    synth.playClick(dir > 0 ? 1.14 : 0.9, 'wheel');
                } else {
                    synth.setVolume(synth.volume + dir * 0.05);
                    synth.playClick(dir > 0 ? 1.1 : 0.92, 'wheel');
                    savePersistentState();
                }
                renderLCDScreen();
            }
        }

        function handleSelectAction() {
            const view = currentView();

            if (view.type === 'now-playing') {
                if (guardHoldLock()) return;
                state.wheelMode = state.wheelMode === 'volume' ? 'seek' : 'volume';
                synth.playClick(1.0, 'enter');
                triggerHaptic(12);
                showLCDToast(state.wheelMode === 'seek' ? 'MODE RODA: GESER WAKTU' : 'MODE RODA: VOLUME', 1200);
                renderLCDScreen();
                return;
            }

            if (view.type === 'detail-page') {
                if (guardHoldLock()) return;
                if (view.pageIndex < view.pages.length - 1) {
                    view.pageIndex++;
                    synth.playClick(1.08, 'wheel');
                    triggerHaptic(10);
                    renderLCDScreen();
                } else {
                    handleMenuBack();
                }
                return;
            }

            if (view.type === 'reminder-detail') {
                if (guardHoldLock()) return;
                triggerHaptic(12);
                toggleReminderCompleted(view.reminderIndex);
                return;
            }

            if (view.type !== 'menu') return;

            const item = view.items[view.selectedIndex];
            if (!item) return;

            if (state.isLocked && !item.allowWhenLocked) {
                guardHoldLock();
                return;
            }

            synth.playClick(1.0, 'enter');
            triggerHaptic(12);

            if (item.action === 'submenu') {
                const sub = buildSubmenu(item.target);
                if (sub) {
                    state.navStack.push(sub);
                    renderLCDScreen();
                }
            } else if (item.action === 'all-tracks') {
                state.navStack.push(buildTrackListMenu('SEMUA LAGU', getAllTracks()));
                renderLCDScreen();
            } else if (item.action === 'folder-tracks') {
                const filtered = getAllTracks().filter(t => t.folder === item.folderName);
                state.navStack.push(buildTrackListMenu(item.folderName, filtered));
                renderLCDScreen();
            } else if (item.action === 'detail-page') {
                state.navStack.push({
                    id: `detail-${Date.now()}`,
                    title: item.detailTitle || 'CATATAN',
                    type: 'detail-page',
                    detailTitle: item.detailTitle,
                    pages: item.pages || ['(Kosong)'],
                    pageIndex: 0
                });
                renderLCDScreen();
            } else if (item.action === 'reminder-detail') {
                state.navStack.push({
                    id: `rem-${Date.now()}`,
                    title: 'DETAIL PENGINGAT',
                    type: 'reminder-detail',
                    reminderIndex: item.reminderIndex
                });
                renderLCDScreen();
            } else if (item.action === 'play-track') {
                startTrackAt(item.trackIndex, item.queue);
                state.navStack.push({ id: 'now-playing', title: 'SEDANG DIPUTAR', type: 'now-playing' });
                renderLCDScreen();
            } else if (item.action === 'now-playing') {
                const pool = getAllTracks();
                if (!synth.currentSong && pool.length > 0) {
                    startTrackAt(0, pool);
                }
                state.navStack.push({ id: 'now-playing', title: 'SEDANG DIPUTAR', type: 'now-playing' });
                renderLCDScreen();
            } else if (item.action === 'shuffle-play') {
                const pool = item.queue && item.queue.length > 0 ? item.queue : getAllTracks();
                if (pool.length === 0) return;
                state.shuffle = true;
                savePersistentState();
                const rand = Math.floor(Math.random() * pool.length);
                startTrackAt(rand, pool);
                state.navStack.push({ id: 'now-playing', title: 'SEDANG DIPUTAR', type: 'now-playing' });
                renderLCDScreen();
            } else if (item.action === 'cycle-theme') {
                cycleLCDTheme();
            } else if (item.action === 'toggle-night') {
                toggleNightMode();
            } else if (item.action === 'toggle-hold') {
                toggleHoldLock();
            } else if (item.action === 'cycle-repeat') {
                cycleRepeatMode();
            } else if (item.action === 'toggle-shuffle') {
                state.shuffle = !state.shuffle;
                savePersistentState();
                renderLCDScreen();
            } else if (item.action === 'toggle-click') {
                synth.clickEnabled = !synth.clickEnabled;
                savePersistentState();
                renderLCDScreen();
            } else if (item.action === 'sync-supabase') {
                supabaseStore.statusLabel = 'SINKRON...';
                renderLCDScreen();
                syncSupabaseData();
            } else if (item.action === 'upload-audio') {
                triggerPhoneAudioPicker();
            }
        }

        function handleMenuBack() {
            if (guardHoldLock()) return;
            synth.playClick(1.0, 'back');
            triggerHaptic(10);
            if (state.navStack.length > 1) {
                state.navStack.pop();
                renderLCDScreen();
            }
        }

        function handlePlayPause() {
            if (guardHoldLock()) return;
            synth.playClick(1.1, 'wheel');
            triggerHaptic(12);
            const pool = state.currentQueue.length > 0 ? state.currentQueue : getAllTracks();
            if (!synth.currentSong) {
                if (pool.length > 0) startTrackAt(0, pool);
            } else {
                synth.togglePlayPause();
                savePersistentState();
                renderLCDScreen();
            }
        }

        ['pointerdown', 'pointermove', 'wheel', 'keydown', 'touchstart'].forEach(evt => {
            window.addEventListener(evt, wakeFromScreensaver, { passive: true });
        });

        /* Click Wheel & Tombol Navigasi: Gulir langsung jalan tanpa tertahan sentuhan awal */
        const clickWheelEl = document.getElementById('clickWheel');
        const centerBtnEl = document.getElementById('btnSelect');
        const btnMenuEl = document.getElementById('btnMenu');
        const btnNextEl = document.getElementById('btnNext');
        const btnPrevEl = document.getElementById('btnPrev');

        let isRotating = false;
        let hasMovedDuringGesture = false;
        let pointerStartX = 0;
        let pointerStartY = 0;
        let prevAngle = null;
        let angleBuffer = 0;
        let smoothVelocity = 0;
        let lastMoveTime = 0;
        let inertiaFrame = null;
        let activeButtonDragCanceller = null;
        const DEG_PER_TICK = 20;
        const DRAG_CANCEL_THRESHOLD_PX = 6;

        function computeAngle(x, y) {
            const rect = clickWheelEl.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            return Math.atan2(y - cy, x - cx) * (180 / Math.PI);
        }

        function stopInertia() {
            if (inertiaFrame) {
                cancelAnimationFrame(inertiaFrame);
                inertiaFrame = null;
            }
        }

        function runInertia() {
            if (Math.abs(smoothVelocity) < 0.18) {
                smoothVelocity = 0;
                inertiaFrame = null;
                return;
            }
            angleBuffer += smoothVelocity * 16;
            smoothVelocity *= 0.84;

            while (angleBuffer >= DEG_PER_TICK) {
                handleWheelStep(1);
                angleBuffer -= DEG_PER_TICK;
            }
            while (angleBuffer <= -DEG_PER_TICK) {
                handleWheelStep(-1);
                angleBuffer += DEG_PER_TICK;
            }
            inertiaFrame = requestAnimationFrame(runInertia);
        }

        function beginRotate(x, y, target) {
            if (target === centerBtnEl) {
                return;
            }
            stopInertia();
            isRotating = true;
            hasMovedDuringGesture = false;
            pointerStartX = x;
            pointerStartY = y;
            prevAngle = computeAngle(x, y);
            angleBuffer = 0;
            smoothVelocity = 0;
            lastMoveTime = performance.now();
        }

        function updateRotate(x, y) {
            if (!isRotating || prevAngle === null) return;
            const dist = Math.hypot(x - pointerStartX, y - pointerStartY);
            if (!hasMovedDuringGesture && dist >= DRAG_CANCEL_THRESHOLD_PX) {
                hasMovedDuringGesture = true;
                if (activeButtonDragCanceller) {
                    activeButtonDragCanceller();
                }
            }

            const now = performance.now();
            const dt = Math.max(10, now - lastMoveTime);
            const cur = computeAngle(x, y);
            let diff = cur - prevAngle;
            if (diff > 180) diff -= 360;
            if (diff < -180) diff += 360;

            const rawVel = diff / dt;
            smoothVelocity = smoothVelocity * 0.72 + rawVel * 0.28;
            angleBuffer += diff;
            prevAngle = cur;
            lastMoveTime = now;

            while (angleBuffer >= DEG_PER_TICK) {
                handleWheelStep(1);
                angleBuffer -= DEG_PER_TICK;
            }
            while (angleBuffer <= -DEG_PER_TICK) {
                handleWheelStep(-1);
                angleBuffer += DEG_PER_TICK;
            }
        }

        function endRotate() {
            if (!isRotating) return;
            const wasDragging = hasMovedDuringGesture;
            isRotating = false;
            hasMovedDuringGesture = false;
            prevAngle = null;
            activeButtonDragCanceller = null;
            if (wasDragging && Math.abs(smoothVelocity) > 0.35) {
                inertiaFrame = requestAnimationFrame(runInertia);
            } else {
                smoothVelocity = 0;
                angleBuffer = 0;
            }
        }

        clickWheelEl.addEventListener('mousedown', (e) => beginRotate(e.clientX, e.clientY, e.target));
        window.addEventListener('mousemove', (e) => updateRotate(e.clientX, e.clientY));
        window.addEventListener('mouseup', endRotate);

        clickWheelEl.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) {
                beginRotate(e.touches[0].clientX, e.touches[0].clientY, e.target);
            }
        }, { passive: true });

        clickWheelEl.addEventListener('touchmove', (e) => {
            if (isRotating && e.touches.length > 0) {
                e.preventDefault();
                updateRotate(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: false });

        clickWheelEl.addEventListener('touchend', endRotate);
        clickWheelEl.addEventListener('touchcancel', endRotate);

        clickWheelEl.addEventListener('wheel', (e) => {
            e.preventDefault();
            if (Math.abs(e.deltaY) > 4) {
                handleWheelStep(e.deltaY > 0 ? 1 : -1);
            }
        }, { passive: false });

        /* Tombol MENU: Fitur tahan HANYA aktif di Now Playing; jika jari bergeser, langsung beralih ke gulir roda */
        let menuLongPressTimer = null;
        let menuLongPressed = false;
        let menuCancelledByScroll = false;

        function clearMenuHoldTimer() {
            if (menuLongPressTimer) {
                clearTimeout(menuLongPressTimer);
                menuLongPressTimer = null;
            }
        }

        function startMenuPress(e) {
            menuLongPressed = false;
            menuCancelledByScroll = false;
            clearMenuHoldTimer();

            const pt = e.touches && e.touches[0] ? e.touches[0] : e;
            beginRotate(pt.clientX, pt.clientY, null);
            activeButtonDragCanceller = () => {
                menuCancelledByScroll = true;
                clearMenuHoldTimer();
            };

            if (isNowPlayingActive()) {
                menuLongPressTimer = setTimeout(() => {
                    menuLongPressTimer = null;
                    if (!isNowPlayingActive() || menuCancelledByScroll || hasMovedDuringGesture) return;
                    menuLongPressed = true;
                    toggleHoldLock();
                }, 650);
            }
        }

        function endMenuPress() {
            const wasLongPressed = menuLongPressed;
            const wasScrolled = menuCancelledByScroll || hasMovedDuringGesture;
            clearMenuHoldTimer();
            menuLongPressed = false;
            menuCancelledByScroll = false;
            activeButtonDragCanceller = null;
            if (!wasLongPressed && !wasScrolled) {
                handleMenuBack();
            }
        }

        btnMenuEl.addEventListener('pointerdown', startMenuPress);
        btnMenuEl.addEventListener('pointerup', endMenuPress);
        btnMenuEl.addEventListener('pointercancel', () => {
            clearMenuHoldTimer();
            menuLongPressed = false;
            menuCancelledByScroll = false;
            activeButtonDragCanceller = null;
        });

        /* Tombol NEXT / PREV: Fitur tahan HANYA aktif di Now Playing; di luar Now Playing tanpa fitur tahan & langsung bisa digulir */
        function bindSeekOrSkipButton(btnEl, direction) {
            let holdTimer = null;
            let seekInterval = null;
            let didSeek = false;
            let cancelledByScroll = false;

            const clearButtonHold = () => {
                if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
                if (seekInterval) { clearInterval(seekInterval); seekInterval = null; }
            };

            const triggerSkip = () => {
                if (!isNowPlayingActive()) return;
                if (direction > 0) nextTrack(false);
                else prevTrack();
            };

            const startPress = (e) => {
                didSeek = false;
                cancelledByScroll = false;
                clearButtonHold();

                const pt = e.touches && e.touches[0] ? e.touches[0] : e;
                beginRotate(pt.clientX, pt.clientY, null);
                activeButtonDragCanceller = () => {
                    cancelledByScroll = true;
                    clearButtonHold();
                };

                if (!isNowPlayingActive()) return;

                holdTimer = setTimeout(() => {
                    holdTimer = null;
                    if (!isNowPlayingActive() || cancelledByScroll || hasMovedDuringGesture) return;
                    if (guardHoldLock()) return;
                    didSeek = true;
                    synth.seekBy(direction * 15);
                    synth.playClick(direction > 0 ? 1.15 : 0.9, 'wheel');
                    triggerHaptic(10);
                    showLCDToast(direction > 0 ? 'MAJU +15 DETIK' : 'MUNDUR -15 DETIK', 900);
                    seekInterval = setInterval(() => {
                        if (!isNowPlayingActive() || cancelledByScroll) {
                            clearButtonHold();
                            return;
                        }
                        synth.seekBy(direction * 15);
                        synth.playClick(direction > 0 ? 1.15 : 0.9, 'wheel');
                        triggerHaptic(10);
                    }, 320);
                }, 520);
            };

            const endPress = () => {
                const wasSeeked = didSeek;
                const wasScrolled = cancelledByScroll || hasMovedDuringGesture;
                clearButtonHold();
                didSeek = false;
                cancelledByScroll = false;
                activeButtonDragCanceller = null;
                if (!isNowPlayingActive() || wasScrolled) return;
                if (!wasSeeked) {
                    triggerSkip();
                }
            };

            btnEl.addEventListener('pointerdown', startPress);
            btnEl.addEventListener('pointerup', endPress);
            btnEl.addEventListener('pointercancel', () => {
                clearButtonHold();
                didSeek = false;
                cancelledByScroll = false;
                activeButtonDragCanceller = null;
            });
        }

        bindSeekOrSkipButton(btnNextEl, 1);
        bindSeekOrSkipButton(btnPrevEl, -1);

        document.getElementById('btnPlay').addEventListener('click', (e) => {
            e.stopPropagation();
            if (hasMovedDuringGesture) return;
            handlePlayPause();
        });
        centerBtnEl.addEventListener('click', (e) => {
            e.stopPropagation();
            handleSelectAction();
        });

        lcdScreenBodyEl.addEventListener('click', (e) => {
            const view = currentView();

            if (view.type === 'detail-page') {
                if (guardHoldLock()) return;
                const rect = lcdScreenBodyEl.getBoundingClientRect();
                const isLeft = (e.clientX - rect.left) < rect.width * 0.42;
                handleWheelStep(isLeft ? -1 : 1);
                return;
            }

            if (view.type === 'reminder-detail') {
                if (guardHoldLock()) return;
                toggleReminderCompleted(view.reminderIndex);
                return;
            }

            const row = e.target.closest('.calc-menu-row');
            if (!row) return;
            const idx = parseInt(row.dataset.idx, 10);
            if (view.type === 'menu' && !isNaN(idx)) {
                const targetItem = view.items[idx];
                if (state.isLocked && !(targetItem && targetItem.allowWhenLocked)) {
                    guardHoldLock();
                    return;
                }

                if (view.selectedIndex === idx) {
                    handleSelectAction();
                } else {
                    view.selectedIndex = idx;
                    synth.playClick(1.05, 'wheel');
                    syncMenuSelectionDOM(view);
                }
            }
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowDown') { e.preventDefault(); handleWheelStep(1); }
            else if (e.key === 'ArrowUp') { e.preventDefault(); handleWheelStep(-1); }
            else if (e.key === 'Enter') { e.preventDefault(); handleSelectAction(); }
            else if (e.key === 'Escape' || e.key === 'Backspace') { e.preventDefault(); handleMenuBack(); }
            else if (e.key === ' ') { e.preventDefault(); handlePlayPause(); }
            else if (e.key === 'ArrowRight') {
                e.preventDefault();
                if (currentView().type === 'detail-page') handleWheelStep(1);
                else if (isNowPlayingActive()) {
                    if (e.shiftKey) { if (!guardHoldLock()) synth.seekBy(15); }
                    else nextTrack(false);
                }
            }
            else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                if (currentView().type === 'detail-page') handleWheelStep(-1);
                else if (isNowPlayingActive()) {
                    if (e.shiftKey) { if (!guardHoldLock()) synth.seekBy(-15); }
                    else prevTrack();
                }
            }
            else if (e.key.toLowerCase() === 'h' && isNowPlayingActive()) { e.preventDefault(); toggleHoldLock(); }
        });

        loadPersistentState();
        renderLCDScreen();
        wakeFromScreensaver();
        syncSupabaseData();
    </script>
</body>
</html>
