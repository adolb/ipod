<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="iPod Calc">
    <title>iPod Classic Silver - Calculator LCD Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --lcd-bg: #a3ad96;
            --lcd-bg-dark: #939e86;
            --lcd-ink: #171c14;
            --lcd-ghost: rgba(23, 28, 20, 0.08);
            --lcd-grid: rgba(23, 28, 20, 0.045);
        }

        [data-lcd-theme="amber"] {
            --lcd-bg: #d99b38;
            --lcd-bg-dark: #c48625;
            --lcd-ink: #241404;
            --lcd-ghost: rgba(36, 20, 4, 0.09);
            --lcd-grid: rgba(36, 20, 4, 0.05);
        }

        [data-lcd-theme="blue"] {
            --lcd-bg: #8eb4c9;
            --lcd-bg-dark: #789fb5;
            --lcd-ink: #0c1d29;
            --lcd-ghost: rgba(12, 29, 41, 0.09);
            --lcd-grid: rgba(12, 29, 41, 0.05);
        }

        [data-lcd-theme="silver"] {
            --lcd-bg: #c6cbc4;
            --lcd-bg-dark: #b3b9b1;
            --lcd-ink: #161816;
            --lcd-ghost: rgba(22, 24, 22, 0.08);
            --lcd-grid: rgba(22, 24, 22, 0.045);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Share Tech Mono', monospace;
        }

        .ipod-fullscreen-chassis {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding:
                max(14px, calc(env(safe-area-inset-top) + 8px))
                max(14px, calc(env(safe-area-inset-right) + 8px))
                max(14px, calc(env(safe-area-inset-bottom) + 10px))
                max(14px, calc(env(safe-area-inset-left) + 8px));
            background:
                repeating-linear-gradient(
                    90deg,
                    rgba(255, 255, 255, 0.05) 0px,
                    rgba(255, 255, 255, 0.05) 1px,
                    rgba(0, 0, 0, 0.025) 1px,
                    rgba(0, 0, 0, 0.025) 2px
                ),
                radial-gradient(circle at 50% 25%, #eff1f4 0%, #dcdfe4 48%, #c7cbd1 100%);
            position: relative;
            transition: background 0.45s ease;
        }

        body.screensaver-mode .ipod-fullscreen-chassis {
            background: #050505;
        }

        body.screensaver-mode .top-hardware-bar {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
        }

        .top-hardware-bar {
            transition: opacity 0.35s ease;
        }

        body.screensaver-mode .calculator-lcd-frame {
            box-shadow:
                inset 0 3px 8px rgba(0, 0, 0, 0.9),
                0 0 0 1px #171717;
        }

        .top-hardware-bar {
            width: 100%;
            max-width: 680px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-family: 'Orbitron', sans-serif;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: #6b7280;
            flex-shrink: 0;
        }

        .calculator-lcd-frame {
            width: 100%;
            max-width: 680px;
            height: 44vh;
            height: 44dvh;
            min-height: 220px;
            max-height: 360px;
            background: #232629;
            border-radius: 10px;
            padding: clamp(6px, 1.2vh, 10px);
            box-shadow:
                inset 0 3px 8px rgba(0, 0, 0, 0.85),
                0 1px 0 rgba(255, 255, 255, 0.9),
                0 0 0 1px #9ca3af;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .lcd-panel {
            width: 100%;
            height: 100%;
            background-color: var(--lcd-bg);
            background-image:
                linear-gradient(to right, var(--lcd-grid) 1px, transparent 1px),
                linear-gradient(to bottom, var(--lcd-grid) 1px, transparent 1px),
                radial-gradient(circle at 50% 45%, var(--lcd-bg) 40%, var(--lcd-bg-dark) 100%);
            background-size: 3px 3px, 3px 3px, 100% 100%;
            border-radius: 4px;
            box-shadow:
                inset 0 4px 12px rgba(0, 0, 0, 0.38),
                inset 0 0 2px rgba(0, 0, 0, 0.5);
            color: var(--lcd-ink);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        .lcd-panel::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(118deg, rgba(255, 255, 255, 0.16) 0%, rgba(255, 255, 255, 0.04) 36%, transparent 38%);
            pointer-events: none;
            z-index: 20;
        }

        .font-calc-digit {
            font-family: 'Orbitron', 'Share Tech Mono', monospace;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.06em;
        }

        .font-calc-matrix {
            font-family: 'VT323', 'Share Tech Mono', monospace;
            letter-spacing: 0.04em;
        }

        .lcd-status-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 5px 10px;
            border-bottom: 1.5px solid var(--lcd-ink);
            font-size: clamp(11px, 1.6vh, 13px);
            font-weight: 700;
            flex-shrink: 0;
        }

        .lcd-badge {
            border: 1px solid var(--lcd-ink);
            padding: 0 4px;
            font-size: 9px;
            line-height: 1.3;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
        }

        .lcd-badge.ghost {
            border-color: var(--lcd-ghost);
            color: var(--lcd-ghost);
        }

        .calc-menu-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: clamp(4px, 0.8vh, 7px) 10px;
            border-bottom: 1px dashed var(--lcd-ghost);
            font-family: 'VT323', monospace;
            font-size: clamp(19px, 2.7vh, 24px);
            line-height: 1.1;
            cursor: pointer;
        }

        .calc-menu-row.active {
            background-color: var(--lcd-ink);
            color: var(--lcd-bg);
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .wheel-stage {
            flex: 1;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 0;
        }

        .click-wheel {
            width: clamp(210px, 34vh, 290px);
            height: clamp(210px, 34vh, 290px);
            border-radius: 50%;
            background: radial-gradient(circle at 50% 42%, #ffffff 0%, #f3f4f6 65%, #e2e5ea 100%);
            box-shadow:
                inset 0 2px 5px rgba(255, 255, 255, 0.95),
                inset 0 -4px 8px rgba(0, 0, 0, 0.09),
                0 6px 18px rgba(15, 23, 42, 0.14),
                0 0 0 1.5px #b3b9c4;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            cursor: grab;
        }

        .click-wheel:active {
            cursor: grabbing;
        }

        body.screensaver-mode .click-wheel {
            background: #080808;
            box-shadow:
                inset 0 1px 3px rgba(255, 255, 255, 0.04),
                0 0 0 1px #141414;
            transition: background 0.45s ease, box-shadow 0.45s ease;
        }

        body.screensaver-mode .wheel-btn {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .wheel-btn {
            transition: opacity 0.3s ease, color 0.1s ease, transform 0.1s ease;
        }

        .wheel-btn {
            position: absolute;
            color: #7d8490;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: clamp(10px, 1.5vh, 13px);
            letter-spacing: 1.2px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 68px;
            height: 44px;
            cursor: pointer;
            transition: color 0.1s ease, transform 0.1s ease;
        }

        .wheel-btn:active {
            color: #1f2937;
        }

        .btn-menu { top: 12px; left: 50%; transform: translateX(-50%); }
        .btn-menu:active { transform: translateX(-50%) scale(0.93); }

        .btn-next { right: 10px; top: 50%; transform: translateY(-50%); }
        .btn-next:active { transform: translateY(-50%) scale(0.93); }

        .btn-prev { left: 10px; top: 50%; transform: translateY(-50%); }
        .btn-prev:active { transform: translateY(-50%) scale(0.93); }

        .btn-play { bottom: 12px; left: 50%; transform: translateX(-50%); }
        .btn-play:active { transform: translateX(-50%) scale(0.93); }

        .center-button {
            width: 36%;
            height: 36%;
            border-radius: 50%;
            background:
                repeating-linear-gradient(
                    90deg,
                    rgba(255, 255, 255, 0.06) 0px,
                    rgba(255, 255, 255, 0.06) 1px,
                    rgba(0, 0, 0, 0.03) 1px,
                    rgba(0, 0, 0, 0.03) 2px
                ),
                linear-gradient(145deg, #cfd3da 0%, #e4e7ec 50%, #f5f6f8 100%);
            box-shadow:
                inset 0 2px 5px rgba(110, 118, 130, 0.45),
                inset 0 -1px 2px rgba(255, 255, 255, 0.95),
                0 0 0 1.5px #aeb5c0;
            cursor: pointer;
            transition: transform 0.08s ease, box-shadow 0.08s ease;
            z-index: 5;
        }

        .center-button:active {
            transform: scale(0.95);
            box-shadow:
                inset 0 4px 8px rgba(85, 92, 104, 0.65),
                0 0 0 1.5px #9ca3af;
        }

        body.screensaver-mode .center-button {
            background: #0b0b0b;
            box-shadow:
                inset 0 1px 2px rgba(255, 255, 255, 0.03),
                0 0 0 1px #161616;
            transition: background 0.45s ease, box-shadow 0.45s ease;
        }

        .calc-bar-container {
            display: grid;
            grid-template-columns: repeat(20, 1fr);
            gap: 2px;
            padding: 2px;
            border: 1.5px solid var(--lcd-ink);
            height: 14px;
        }

        .calc-bar-cell {
            background-color: var(--lcd-ghost);
            height: 100%;
        }

        .calc-bar-cell.filled {
            background-color: var(--lcd-ink);
        }

        .digit-stack {
            position: relative;
            display: inline-block;
        }
        .digit-ghost {
            color: var(--lcd-ghost);
            user-select: none;
        }
        .digit-active {
            position: absolute;
            top: 0;
            right: 0;
            color: var(--lcd-ink);
        }

        .calc-detail-box {
            font-family: 'VT323', monospace;
            font-size: clamp(17px, 2.4vh, 21px);
            line-height: 1.25;
            white-space: pre-wrap;
            word-break: break-word;
            user-select: text;
            -webkit-user-select: text;
        }

        #calcDetailScroll {
            touch-action: pan-y;
            overscroll-behavior: contain;
        }
    </style>
</head>

    <script>
        const SUPABASE_CONFIG = {
            url: 'https://awlxjzfadktcthbumxle.supabase.co',
            key: 'sb_publishable_LnE9IH5KKDzdV-gj9tIb6w_uOGVZi4o',
            bucket: 'documents',
            folder: 'uploads'
        };

        let supabaseClient = null;
        try {
            if (window.supabase && typeof window.supabase.createClient === 'function') {
                supabaseClient = window.supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.key, {
                    auth: { persistSession: false, autoRefreshToken: false }
                });
            }
        } catch (err) {
            console.warn('Inisialisasi Supabase gagal, memakai mode lokal/fallback:', err);
        }

        const supabaseStore = {
            connected: false,
            statusLabel: 'LOKAL / OFFLINE',
            cloudTracks: [],
            notes: [],
            reminders: []
        };

        function cleanUploadName(rawName) {
            if (!rawName) return 'BERKAS TANPA NAMA';
            return rawName
                .replace(/^\d+_/, '')
                .replace(/\.[^/.]+$/, '')
                .replace(/[_-]+/g, ' ')
                .trim()
                .toUpperCase() || rawName.toUpperCase();
        }

        class CalculatorSynthEngine {
            constructor() {
                this.ctx = null;
                this.masterGain = null;
                this.audioEl = new Audio();
                this.audioEl.crossOrigin = 'anonymous';
                this.audioEl.preload = 'metadata';

                this.volume = 0.8;
                this.clickEnabled = true;
                this.isPlaying = false;
                this.currentSong = null;
                this.elapsed = 0;
                this.stepIndex = 0;
                this.progressTimer = null;
                this.spectrumLevels = [2, 4, 6, 3, 7, 5, 4, 2];
                this.onTick = null;
                this.onSongFinish = null;

                this.bindAudioElementEvents();
            }

            bindAudioElementEvents() {
                this.audioEl.addEventListener('loadedmetadata', () => {
                    if (this.currentSong && Number.isFinite(this.audioEl.duration) && this.audioEl.duration > 0) {
                        this.currentSong.duration = Math.round(this.audioEl.duration);
                        if (this.onTick) this.onTick();
                    }
                });

                this.audioEl.addEventListener('timeupdate', () => {
                    if (this.isPlaying && this.currentSong) {
                        this.elapsed = this.audioEl.currentTime || 0;
                        this.updateSpectrumFromWave();
                    }
                });

                this.audioEl.addEventListener('error', () => {
                    if (this.isPlaying) {
                        this.isPlaying = false;
                        this.stopProgressTimer();
                        if (this.onTick) this.onTick();
                    }
                });

                this.audioEl.addEventListener('ended', () => {
                    this.elapsed = 0;
                    if (this.onSongFinish) this.onSongFinish();
                });
            }

            ensureContext() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioCtx();
                    this.masterGain = this.ctx.createGain();
                    this.masterGain.gain.setValueAtTime(this.volume, this.ctx.currentTime);
                    this.masterGain.connect(this.ctx.destination);
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume().catch(() => {});
                }
            }

            setVolume(val) {
                this.volume = Math.max(0, Math.min(1, val));
                if (this.audioEl) {
                    this.audioEl.volume = this.volume;
                }
                if (this.masterGain && this.ctx) {
                    this.masterGain.gain.setTargetAtTime(this.volume, this.ctx.currentTime, 0.02);
                }
            }

            playClick(pitch = 1.0) {
                if (!this.clickEnabled) return;
                try {
                    this.ensureContext();
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(1250 * pitch, now);
                    osc.frequency.exponentialRampToValueAtTime(190 * pitch, now + 0.013);

                    gain.gain.setValueAtTime(0.22, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.014);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(now);
                    osc.stop(now + 0.015);
                } catch (e) {}
            }

            updateSpectrumFromWave() {
                this.stepIndex++;
                this.spectrumLevels = this.spectrumLevels.map((_, i) => {
                    const wave = Math.abs(Math.sin((this.stepIndex + i * 1.35) * 0.8));
                    return Math.max(1, Math.min(8, Math.round(wave * 8)));
                });
                if (this.onTick) this.onTick();
            }

            stopProgressTimer() {
                if (this.progressTimer) {
                    clearInterval(this.progressTimer);
                    this.progressTimer = null;
                }
            }

            startProgressTimer() {
                this.stopProgressTimer();
                this.progressTimer = setInterval(() => {
                    if (!this.isPlaying || !this.currentSong) return;
                    if (Number.isFinite(this.audioEl.currentTime) && this.audioEl.currentTime > 0) {
                        this.elapsed = this.audioEl.currentTime;
                    } else {
                        this.elapsed += 0.25;
                    }
                    if (this.currentSong.duration > 0 && this.elapsed >= this.currentSong.duration) {
                        this.elapsed = 0;
                        if (this.onSongFinish) this.onSongFinish();
                    } else if (this.onTick) {
                        this.onTick();
                    }
                }, 250);
            }

            playSong(song) {
                this.stopProgressTimer();
                this.audioEl.pause();
                this.currentSong = song || null;
                this.elapsed = 0;
                this.stepIndex = 0;
                this.audioEl.volume = this.volume;

                if (!song || !song.audioUrl) {
                    this.isPlaying = false;
                    this.audioEl.removeAttribute('src');
                    return;
                }

                this.isPlaying = true;
                this.audioEl.src = song.audioUrl;
                const playPromise = this.audioEl.play();
                if (playPromise && typeof playPromise.catch === 'function') {
                    playPromise.catch(() => {
                        if (this.currentSong === song) {
                            this.isPlaying = false;
                            this.stopProgressTimer();
                            if (this.onTick) this.onTick();
                        }
                    });
                }
                this.startProgressTimer();
            }

            togglePlayPause() {
                if (!this.currentSong || !this.currentSong.audioUrl) return false;

                if (this.isPlaying) {
                    this.isPlaying = false;
                    this.stopProgressTimer();
                    this.audioEl.pause();
                } else {
                    this.isPlaying = true;
                    this.audioEl.play().catch(() => {
                        this.isPlaying = false;
                        this.stopProgressTimer();
                        if (this.onTick) this.onTick();
                    });
                    this.startProgressTimer();
                }
                return this.isPlaying;
            }
        }

        const synth = new CalculatorSynthEngine();

        function getAllTracks() {
            return supabaseStore.cloudTracks;
        }

        async function syncSupabaseData() {
            if (!supabaseClient) {
                supabaseStore.connected = false;
                supabaseStore.statusLabel = 'LOKAL / OFFLINE';
                supabaseStore.cloudTracks = [];
                state.currentQueue = [];
                state.currentTrackIndex = 0;
                renderLCDScreen();
                return;
            }

            try {
                const [storageRes, notesRes, remRes] = await Promise.allSettled([
                    supabaseClient.storage
                        .from(SUPABASE_CONFIG.bucket)
                        .list(SUPABASE_CONFIG.folder, {
                            limit: 100,
                            offset: 0,
                            sortBy: { column: 'name', order: 'asc' }
                        }),
                    supabaseClient.from('catatan').select('*').order('is_pinned', { ascending: false }).order('id', { ascending: false }).limit(50),
                    supabaseClient.from('pengingat').select('*').limit(50)
                ]);

                if (storageRes.status === 'fulfilled' && !storageRes.value.error && Array.isArray(storageRes.value.data)) {
                    const audioFiles = storageRes.value.data.filter(
                        file => file && file.name && /\.(mp3|wav|m4a|ogg)$/i.test(file.name)
                    );
                    supabaseStore.cloudTracks = audioFiles.map((file, idx) => {
                        const urlData = supabaseClient.storage
                            .from(SUPABASE_CONFIG.bucket)
                            .getPublicUrl(`${SUPABASE_CONFIG.folder}/${file.name}`);
                        return {
                            id: `SB-${idx + 1}`,
                            title: cleanUploadName(file.name),
                            artist: 'SUPABASE STORAGE',
                            duration: 0,
                            audioUrl: urlData?.data?.publicUrl || ''
                        };
                    });
                } else {
                    supabaseStore.cloudTracks = [];
                }

                if (notesRes.status === 'fulfilled' && !notesRes.value.error && Array.isArray(notesRes.value.data)) {
                    supabaseStore.notes = notesRes.value.data;
                }

                if (remRes.status === 'fulfilled' && !remRes.value.error && Array.isArray(remRes.value.data)) {
                    supabaseStore.reminders = remRes.value.data;
                }

                const anySuccess =
                    (storageRes.status === 'fulfilled' && !storageRes.value.error) ||
                    (notesRes.status === 'fulfilled' && !notesRes.value.error) ||
                    (remRes.status === 'fulfilled' && !remRes.value.error);

                supabaseStore.connected = anySuccess;
                supabaseStore.statusLabel = anySuccess ? 'TERHUBUNG' : 'TERBATAS / OFFLINE';
            } catch (err) {
                supabaseStore.connected = false;
                supabaseStore.statusLabel = 'TERBATAS / OFFLINE';
                supabaseStore.cloudTracks = [];
            }

            state.currentQueue = getAllTracks();
            if (state.currentQueue.length === 0) {
                state.currentTrackIndex = 0;
            } else if (state.currentTrackIndex >= state.currentQueue.length) {
                state.currentTrackIndex = 0;
            }
            renderLCDScreen();
        }

        const LCD_THEMES = ['olive', 'amber', 'blue', 'silver'];
        const THEME_NAMES = {
            olive: 'HIJAU-LCD',
            amber: 'AMBER-EL',
            blue: 'BIRU-DINGIN',
            silver: 'PERAK-MONO'
        };

        const state = {
            isLocked: false,
            shuffle: false,
            themeIndex: 0,
            currentQueue: [],
            currentTrackIndex: 0,
            navStack: [
                {
                    id: 'main',
                    title: 'MENU UTAMA',
                    type: 'menu',
                    selectedIndex: 0,
                    items: [
                        { label: '01. MUSIK SUPABASE', action: 'submenu', target: 'music' },
                        { label: '02. CATATAN SUPABASE', action: 'submenu', target: 'notes' },
                        { label: '03. PENGINGAT SUPABASE', action: 'submenu', target: 'reminders' },
                        { label: '04. SEDANG DIPUTAR', action: 'now-playing' },
                        { label: '05. CAHAYA LCD', action: 'cycle-theme', getVal: () => THEME_NAMES[LCD_THEMES[state.themeIndex]] },
                        { label: '06. ACAK LAGU', action: 'toggle-shuffle', getVal: () => state.shuffle ? 'AKTIF' : 'MATI' },
                        { label: '07. SUARA KLIK', action: 'toggle-click', getVal: () => synth.clickEnabled ? 'AKTIF' : 'MATI' },
                        { label: '08. SINKRON SUPABASE', action: 'sync-supabase', getVal: () => supabaseStore.statusLabel }
                    ]
                }
            ]
        };

        function currentView() {
            return state.navStack[state.navStack.length - 1];
        }

        function formatCalcTime(sec) {
            const s = Math.max(0, Math.floor(sec));
            const m = Math.floor(s / 60);
            const r = s % 60;
            return `${m < 10 ? '0' : ''}${m}:${r < 10 ? '0' : ''}${r}`;
        }

        function padTwo(num) {
            return num < 10 ? `0${num}` : `${num}`;
        }

        function buildSubmenu(target) {
            const allTracks = getAllTracks();

            if (target === 'music') {
                const trackItems = allTracks.length > 0
                    ? allTracks.map((trk, idx) => ({
                        label: `${padTwo(idx + 1)}. ${trk.title}`,
                        rightText: trk.duration > 0 ? formatCalcTime(trk.duration) : 'MP3',
                        action: 'play-track',
                        queue: allTracks,
                        trackIndex: idx
                    }))
                    : [{
                        label: 'BELUM ADA AUDIO DI SUPABASE',
                        rightText: 'KOSONG',
                        action: 'detail',
                        detailTitle: 'MUSIK SUPABASE',
                        detailBody: `Status: ${supabaseStore.statusLabel}\nTidak ada file audio di bucket "${SUPABASE_CONFIG.bucket}/${SUPABASE_CONFIG.folder}".`
                    }];

                return {
                    id: 'music',
                    title: 'MUSIK SUPABASE',
                    type: 'menu',
                    selectedIndex: 0,
                    items: [
                        ...(allTracks.length > 0 ? [{ label: 'PUTAR ACAK SUPABASE', action: 'shuffle-play' }] : []),
                        ...trackItems
                    ]
                };
            }

            if (target === 'notes') {
                const items = supabaseStore.notes.length > 0
                    ? supabaseStore.notes.map((n, i) => ({
                        label: `${padTwo(i + 1)}. ${n.is_pinned ? '[PIN] ' : ''}${(n.tittle || 'TANPA JUDUL').toUpperCase()}`,
                        rightText: 'BACA',
                        action: 'detail',
                        detailTitle: (n.tittle || 'CATATAN').toUpperCase(),
                        detailBody: n.description || '(Kosong)'
                    }))
                    : [{
                        label: 'TIDAK ADA CATATAN / OFFLINE',
                        rightText: 'INFO',
                        action: 'detail',
                        detailTitle: 'INFO CATATAN',
                        detailBody: `Status: ${supabaseStore.statusLabel}\nBelum ada data catatan yang dimuat.`
                    }];
                return { id: 'notes', title: 'CATATAN', type: 'menu', selectedIndex: 0, items };
            }

            if (target === 'reminders') {
                const items = supabaseStore.reminders.length > 0
                    ? supabaseStore.reminders.map((r, i) => ({
                        label: `${padTwo(i + 1)}. ${r.is_completed ? '[SELESAI] ' : ''}${(r.content || 'PENGINGAT').toUpperCase()}`,
                        rightText: r.reminder_time ? r.reminder_time.substring(0, 5) : '--:--',
                        action: 'detail',
                        detailTitle: 'DETAIL PENGINGAT',
                        detailBody: `Keterangan: ${r.content || '-'}\nTanggal: ${r.reminder_date || '-'}\nJam: ${r.reminder_time || '-'}\nStatus: ${r.is_completed ? 'Selesai' : 'Aktif'}`
                    }))
                    : [{
                        label: 'TIDAK ADA PENGINGAT / OFFLINE',
                        rightText: 'INFO',
                        action: 'detail',
                        detailTitle: 'INFO PENGINGAT',
                        detailBody: `Status: ${supabaseStore.statusLabel}\nBelum ada jadwal pengingat.`
                    }];
                return { id: 'reminders', title: 'PENGINGAT', type: 'menu', selectedIndex: 0, items };
            }

            return null;
        }

        const lcdHeaderTitleEl = document.getElementById('lcdHeaderTitle');
        const lcdScreenBodyEl = document.getElementById('lcdScreenBody');
        const lcdVolIndicatorEl = document.getElementById('lcdVolIndicator');
        const lcdTrackCounterEl = document.getElementById('lcdTrackCounter');
        const badgePlayEl = document.getElementById('badgePlay');
        const badgeHoldEl = document.getElementById('badgeHold');
        const badgeShuffleEl = document.getElementById('badgeShuffle');

        function updateStatusAnnunciators() {
            const view = currentView();
            lcdHeaderTitleEl.textContent = view.title;

            if (synth.isPlaying) {
                badgePlayEl.textContent = 'PUTAR ▶';
                badgePlayEl.className = 'lcd-badge';
            } else if (synth.currentSong) {
                badgePlayEl.textContent = 'JEDA ❚❚';
                badgePlayEl.className = 'lcd-badge';
            } else {
                badgePlayEl.textContent = 'SIAP';
                badgePlayEl.className = 'lcd-badge';
            }

            badgeHoldEl.className = state.isLocked ? 'lcd-badge' : 'lcd-badge ghost';
            badgeShuffleEl.className = state.shuffle ? 'lcd-badge' : 'lcd-badge ghost';

            const volPct = Math.round(synth.volume * 100);
            lcdVolIndicatorEl.textContent = `VOL:${padTwo(volPct)}`;
            const qLen = Math.max(1, state.currentQueue.length);
            const curNum = state.currentQueue.length > 0 ? state.currentTrackIndex + 1 : 0;
            lcdTrackCounterEl.textContent = `TRK ${padTwo(curNum)}/${padTwo(qLen)}`;
        }

        function renderLCDScreen() {
            updateStatusAnnunciators();
            const view = currentView();

            if (view.type === 'menu') {
                const rowsHTML = view.items.map((item, idx) => {
                    const isActive = idx === view.selectedIndex;
                    const valueTag = item.getVal ? item.getVal() : (item.rightText || '');
                    const isCurrentlyPlaying = item.action === 'play-track' &&
                        synth.currentSong &&
                        item.queue[item.trackIndex] &&
                        item.queue[item.trackIndex].id === synth.currentSong.id;

                    return `
                        <div class="calc-menu-row ${isActive ? 'active' : ''}" data-idx="${idx}">
                            <div class="flex items-center gap-1.5 truncate pr-2">
                                <span>${isActive ? '▶' : (isCurrentlyPlaying ? '♪' : ' ')}</span>
                                <span class="truncate">${item.label}</span>
                            </div>
                            <div class="shrink-0 font-calc-digit text-xs sm:text-sm">
                                ${valueTag ? `[${valueTag}]` : '&gt;'}
                            </div>
                        </div>
                    `;
                }).join('');

                lcdScreenBodyEl.innerHTML = `
                    <div id="calcListScroll" class="flex-1 overflow-y-auto no-scrollbar">
                        ${rowsHTML}
                    </div>
                `;

                const scrollContainer = document.getElementById('calcListScroll');
                const activeRow = scrollContainer?.querySelector('.calc-menu-row.active');
                if (activeRow) {
                    activeRow.scrollIntoView({ block: 'nearest' });
                }
                return;
            }

            if (view.type === 'detail') {
                lcdScreenBodyEl.innerHTML = `
                    <div class="flex-1 flex flex-col p-2.5 sm:p-3.5 overflow-hidden">
                        <div class="font-calc-digit text-xs font-bold border-b border-current/40 pb-1 mb-1.5 uppercase shrink-0">
                            ${view.detailTitle || 'RINCIAN'}
                        </div>
                        <div id="calcDetailScroll" class="flex-1 overflow-y-auto no-scrollbar pr-0.5">
                            <div class="calc-detail-box">${view.detailBody || ''}</div>
                        </div>
                        <div class="text-[10px] font-calc-digit opacity-75 pt-1.5 border-t border-current/25 mt-1.5 shrink-0 flex justify-between">
                            <span>RODA/GULIR = BACA</span>
                            <span>[MENU] = KEMBALI</span>
                        </div>
                    </div>
                `;
                return;
            }

            if (view.type === 'now-playing') {
                const song = synth.currentSong || state.currentQueue[state.currentTrackIndex] || null;
                if (!song) {
                    lcdScreenBodyEl.innerHTML = `
                        <div class="flex-1 flex flex-col items-center justify-center p-3 text-center">
                            <div class="font-calc-matrix text-2xl sm:text-3xl font-bold">TIDAK ADA LAGU</div>
                            <div class="font-calc-digit text-xs opacity-80 mt-1">
                                MUSIK DIAMBIL DARI SUPABASE STORAGE
                            </div>
                        </div>
                    `;
                    return;
                }

                const elapsedStr = formatCalcTime(synth.elapsed);
                const totalStr = song.duration > 0 ? formatCalcTime(song.duration) : '--:--';
                const safeDur = song.duration > 0 ? song.duration : 0;
                const filledCells = safeDur > 0
                    ? Math.min(20, Math.max(0, Math.round((synth.elapsed / safeDur) * 20)))
                    : (synth.isPlaying ? Math.max(1, (synth.stepIndex % 20) + 1) : 0);

                let progressCellsHTML = '';
                for (let i = 0; i < 20; i++) {
                    progressCellsHTML += `<div class="calc-bar-cell ${i < filledCells ? 'filled' : ''}"></div>`;
                }

                const spectrumHTML = synth.spectrumLevels.map(lvl => {
                    let blocks = '';
                    for (let b = 8; b >= 1; b--) {
                        const on = synth.isPlaying && b <= lvl;
                        blocks += `<div class="h-[3px] w-full ${on ? 'bg-current' : 'bg-current/10'}"></div>`;
                    }
                    return `<div class="flex-1 flex flex-col gap-[1.5px]">${blocks}</div>`;
                }).join('');

                lcdScreenBodyEl.innerHTML = `
                    <div class="flex-1 flex flex-col justify-between p-2.5 sm:p-3.5">
                        <div class="flex items-start justify-between gap-2 border-b border-current/25 pb-1.5">
                            <div class="min-w-0 flex-1">
                                <div class="font-calc-matrix text-2xl sm:text-3xl leading-none font-bold truncate">
                                    ${song.title}
                                </div>
                                <div class="font-calc-digit text-[10px] sm:text-xs opacity-80 mt-1 truncate">
                                    SUMBER: ${song.artist} // ${song.id}
                                </div>
                            </div>
                            <div class="w-20 sm:w-24 flex gap-[2px] p-1 border border-current/50 shrink-0" title="Spektrum Audio">
                                ${spectrumHTML}
                            </div>
                        </div>

                        <div class="my-auto flex flex-col items-end justify-center py-1">
                            <div class="text-[9px] font-calc-digit uppercase tracking-widest opacity-75">
                                WAKTU BERJALAN / TOTAL
                            </div>
                            <div class="flex items-baseline gap-2">
                                <div class="digit-stack font-calc-digit text-3xl sm:text-5xl font-black leading-none">
                                    <span class="digit-ghost">88:88</span>
                                    <span id="calcElapsedDigits" class="digit-active">${elapsedStr}</span>
                                </div>
                                <span class="font-calc-digit text-base sm:text-xl opacity-75">/ ${totalStr}</span>
                            </div>
                        </div>

                        <div>
                            <div id="calcProgressCells" class="calc-bar-container">
                                ${progressCellsHTML}
                            </div>
                            <div class="flex justify-between items-center mt-1 text-[9px] sm:text-[10px] font-calc-digit">
                                <span>STORAGE: SUPABASE</span>
                                <span>PUTAR RODA = VOL (${Math.round(synth.volume * 100)}%)</span>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        synth.onTick = () => {
            if (currentView().type === 'now-playing') {
                renderLCDScreen();
            }
        };

        synth.onSongFinish = () => {
            nextTrack();
        };

        const IDLE_SCREENSAVER_MS = 15000;
        let idleScreensaverTimer = null;

        function wakeFromScreensaver() {
            document.body.classList.remove('screensaver-mode');
            if (idleScreensaverTimer) clearTimeout(idleScreensaverTimer);
            idleScreensaverTimer = setTimeout(() => {
                document.body.classList.add('screensaver-mode');
            }, IDLE_SCREENSAVER_MS);
        }

        function startTrackAt(index, queue = null) {
            const list = (queue && queue.length > 0) ? queue : getAllTracks();
            if (!list || list.length === 0) {
                state.currentQueue = [];
                state.currentTrackIndex = 0;
                synth.playSong(null);
                renderLCDScreen();
                return;
            }
            state.currentQueue = list;
            const len = state.currentQueue.length;
            state.currentTrackIndex = ((index % len) + len) % len;
            const song = state.currentQueue[state.currentTrackIndex];
            synth.playSong(song);
            renderLCDScreen();
        }

        function nextTrack() {
            if (state.isLocked) return;
            const pool = state.currentQueue.length > 0 ? state.currentQueue : getAllTracks();
            if (pool.length === 0) return;
            synth.playClick(1.12);
            if (state.shuffle && pool.length > 1) {
                let next = Math.floor(Math.random() * pool.length);
                if (next === state.currentTrackIndex) next = (next + 1) % pool.length;
                startTrackAt(next, pool);
            } else {
                startTrackAt(state.currentTrackIndex + 1, pool);
            }
        }

        function prevTrack() {
            if (state.isLocked) return;
            const pool = state.currentQueue.length > 0 ? state.currentQueue : getAllTracks();
            if (pool.length === 0) return;
            synth.playClick(0.95);
            if (synth.elapsed > 3) {
                synth.elapsed = 0;
                try { synth.audioEl.currentTime = 0; } catch (e) {}
                renderLCDScreen();
            } else {
                startTrackAt(state.currentTrackIndex - 1, pool);
            }
        }

        function cycleLCDTheme() {
            state.themeIndex = (state.themeIndex + 1) % LCD_THEMES.length;
            document.body.setAttribute('data-lcd-theme', LCD_THEMES[state.themeIndex]);
            synth.playClick(1.15);
            renderLCDScreen();
        }

        function handleWheelStep(dir) {
            if (state.isLocked) return;
            const view = currentView();

            if (view.type === 'menu') {
                const next = view.selectedIndex + dir;
                if (next >= 0 && next < view.items.length) {
                    view.selectedIndex = next;
                    synth.playClick(dir > 0 ? 1.06 : 0.96);
                    renderLCDScreen();
                }
            } else if (view.type === 'detail') {
                const detailScroll = document.getElementById('calcDetailScroll');
                if (detailScroll) {
                    detailScroll.scrollTop += dir * 44;
                    synth.playClick(dir > 0 ? 1.04 : 0.96);
                }
            } else if (view.type === 'now-playing') {
                synth.setVolume(synth.volume + dir * 0.05);
                synth.playClick(dir > 0 ? 1.1 : 0.92);
                renderLCDScreen();
            }
        }

        function handleSelectAction() {
            if (state.isLocked) return;
            synth.playClick(1.22);
            const view = currentView();
            if (view.type !== 'menu') return;

            const item = view.items[view.selectedIndex];
            if (!item) return;

            if (item.action === 'submenu') {
                const sub = buildSubmenu(item.target);
                if (sub) {
                    state.navStack.push(sub);
                    renderLCDScreen();
                }
            } else if (item.action === 'detail') {
                state.navStack.push({
                    id: `detail-${Date.now()}`,
                    title: item.detailTitle || 'RINCIAN',
                    type: 'detail',
                    detailTitle: item.detailTitle,
                    detailBody: item.detailBody
                });
                renderLCDScreen();
            } else if (item.action === 'play-track') {
                startTrackAt(item.trackIndex, item.queue);
                state.navStack.push({ id: 'now-playing', title: 'SEDANG DIPUTAR', type: 'now-playing' });
                renderLCDScreen();
            } else if (item.action === 'now-playing') {
                const pool = getAllTracks();
                if (!synth.currentSong && pool.length > 0) {
                    startTrackAt(0, pool);
                }
                state.navStack.push({ id: 'now-playing', title: 'SEDANG DIPUTAR', type: 'now-playing' });
                renderLCDScreen();
            } else if (item.action === 'shuffle-play') {
                const pool = getAllTracks();
                if (pool.length === 0) return;
                state.shuffle = true;
                const rand = Math.floor(Math.random() * pool.length);
                startTrackAt(rand, pool);
                state.navStack.push({ id: 'now-playing', title: 'SEDANG DIPUTAR', type: 'now-playing' });
                renderLCDScreen();
            } else if (item.action === 'cycle-theme') {
                cycleLCDTheme();
            } else if (item.action === 'toggle-shuffle') {
                state.shuffle = !state.shuffle;
                renderLCDScreen();
            } else if (item.action === 'toggle-click') {
                synth.clickEnabled = !synth.clickEnabled;
                renderLCDScreen();
            } else if (item.action === 'sync-supabase') {
                supabaseStore.statusLabel = 'SINKRON...';
                renderLCDScreen();
                syncSupabaseData();
            }
        }

        function handleMenuBack() {
            if (state.isLocked) return;
            synth.playClick(0.88);
            if (state.navStack.length > 1) {
                state.navStack.pop();
                renderLCDScreen();
            }
        }

        function handlePlayPause() {
            if (state.isLocked) return;
            synth.playClick(1.1);
            const pool = state.currentQueue.length > 0 ? state.currentQueue : getAllTracks();
            if (!synth.currentSong) {
                if (pool.length > 0) startTrackAt(0, pool);
            } else {
                synth.togglePlayPause();
                renderLCDScreen();
            }
        }

        ['pointerdown', 'pointermove', 'wheel', 'keydown', 'touchstart'].forEach(evt => {
            window.addEventListener(evt, wakeFromScreensaver, { passive: true });
        });

        const clickWheelEl = document.getElementById('clickWheel');
        const centerBtnEl = document.getElementById('btnSelect');
        let isRotating = false;
        let prevAngle = null;
        let angleBuffer = 0;
        const DEG_PER_TICK = 20;

        function computeAngle(x, y) {
            const rect = clickWheelEl.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            return Math.atan2(y - cy, x - cx) * (180 / Math.PI);
        }

        function beginRotate(x, y, target) {
            if (target === centerBtnEl) return;
            isRotating = true;
            prevAngle = computeAngle(x, y);
            angleBuffer = 0;
        }

        function updateRotate(x, y) {
            if (!isRotating || prevAngle === null) return;
            const cur = computeAngle(x, y);
            let diff = cur - prevAngle;
            if (diff > 180) diff -= 360;
            if (diff < -180) diff += 360;

            angleBuffer += diff;
            prevAngle = cur;

            while (angleBuffer >= DEG_PER_TICK) {
                handleWheelStep(1);
                angleBuffer -= DEG_PER_TICK;
            }
            while (angleBuffer <= -DEG_PER_TICK) {
                handleWheelStep(-1);
                angleBuffer += DEG_PER_TICK;
            }
        }

        function endRotate() {
            isRotating = false;
            prevAngle = null;
            angleBuffer = 0;
        }

        clickWheelEl.addEventListener('mousedown', (e) => beginRotate(e.clientX, e.clientY, e.target));
        window.addEventListener('mousemove', (e) => updateRotate(e.clientX, e.clientY));
        window.addEventListener('mouseup', endRotate);

        clickWheelEl.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) {
                beginRotate(e.touches[0].clientX, e.touches[0].clientY, e.target);
            }
        }, { passive: true });

        clickWheelEl.addEventListener('touchmove', (e) => {
            if (isRotating && e.touches.length > 0) {
                e.preventDefault();
                updateRotate(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: false });

        clickWheelEl.addEventListener('touchend', endRotate);

        clickWheelEl.addEventListener('wheel', (e) => {
            e.preventDefault();
            if (Math.abs(e.deltaY) > 4) {
                handleWheelStep(e.deltaY > 0 ? 1 : -1);
            }
        }, { passive: false });

        document.getElementById('btnMenu').addEventListener('click', (e) => { e.stopPropagation(); handleMenuBack(); });
        document.getElementById('btnNext').addEventListener('click', (e) => { e.stopPropagation(); nextTrack(); });
        document.getElementById('btnPrev').addEventListener('click', (e) => { e.stopPropagation(); prevTrack(); });
        document.getElementById('btnPlay').addEventListener('click', (e) => { e.stopPropagation(); handlePlayPause(); });
        centerBtnEl.addEventListener('click', (e) => { e.stopPropagation(); handleSelectAction(); });

        document.getElementById('btnThemeToggle').addEventListener('click', cycleLCDTheme);

        const btnHoldToggle = document.getElementById('btnHoldToggle');
        btnHoldToggle.addEventListener('click', () => {
            state.isLocked = !state.isLocked;
            btnHoldToggle.textContent = state.isLocked ? 'KUNCI: AKTIF' : 'KUNCI: MATI';
            btnHoldToggle.classList.toggle('bg-amber-200/80', state.isLocked);
            synth.playClick(state.isLocked ? 0.8 : 1.2);
            updateStatusAnnunciators();
        });

        lcdScreenBodyEl.addEventListener('click', (e) => {
            const row = e.target.closest('.calc-menu-row');
            if (!row || state.isLocked) return;
            const idx = parseInt(row.dataset.idx, 10);
            const view = currentView();
            if (view.type === 'menu' && !isNaN(idx)) {
                if (view.selectedIndex === idx) {
                    handleSelectAction();
                } else {
                    view.selectedIndex = idx;
                    synth.playClick(1.05);
                    renderLCDScreen();
                }
            }
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowDown') { e.preventDefault(); handleWheelStep(1); }
            else if (e.key === 'ArrowUp') { e.preventDefault(); handleWheelStep(-1); }
            else if (e.key === 'Enter') { e.preventDefault(); handleSelectAction(); }
            else if (e.key === 'Escape' || e.key === 'Backspace') { e.preventDefault(); handleMenuBack(); }
            else if (e.key === ' ') { e.preventDefault(); handlePlayPause(); }
            else if (e.key === 'ArrowRight') { e.preventDefault(); nextTrack(); }
            else if (e.key === 'ArrowLeft') { e.preventDefault(); prevTrack(); }
        });

        renderLCDScreen();
        wakeFromScreensaver();
        syncSupabaseData();
    </script>
</body>
</html>
