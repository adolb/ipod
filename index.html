<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="iPod Calc">
    <meta name="theme-color" content="#121215">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='38' fill='%2318181b'/%3E%3Crect x='26' y='20' width='128' height='62' rx='8' fill='%23a3ad96'/%3E%3Ccircle cx='90' cy='128' r='36' fill='%2327272a' stroke='%2352525b' stroke-width='3'/%3E%3Ccircle cx='90' cy='128' r='13' fill='%2318181b'/%3E%3C/svg%3E">
    <title>iPod Classic - Calculator LCD Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --lcd-bg: #a3ad96;
            --lcd-bg-dark: #939e86;
            --lcd-ink: #171c14;
            --lcd-line: rgba(23, 28, 20, 0.32);
            --lcd-ghost: rgba(23, 28, 20, 0.08);
            --lcd-grid: rgba(23, 28, 20, 0.045);

            /* Mode Siang: iPod Classic Silver */
            --body-outer: #c7cbd1;
            --chassis-bg:
                repeating-linear-gradient(
                    90deg,
                    rgba(255, 255, 255, 0.06) 0px,
                    rgba(255, 255, 255, 0.06) 1px,
                    rgba(0, 0, 0, 0.025) 1px,
                    rgba(0, 0, 0, 0.025) 2px
                ),
                radial-gradient(circle at 50% 22%, #f4f5f7 0%, #dfe2e7 48%, #c7cbd1 100%);
            --bezel-bg: linear-gradient(145deg, #2b2e33 0%, #181a1d 100%);
            --bezel-shadow:
                inset 0 3px 8px rgba(0, 0, 0, 0.85),
                0 1px 0 rgba(255, 255, 255, 0.55),
                0 6px 16px rgba(15, 23, 42, 0.14),
                0 0 0 1px rgba(148, 163, 184, 0.6);
            --wheel-bg: radial-gradient(circle at 50% 38%, #ffffff 0%, #f1f3f6 65%, #dfe3e8 100%);
            --wheel-ring: #b3b9c4;
            --wheel-shadow:
                inset 0 2px 5px rgba(255, 255, 255, 0.75),
                inset 0 -4px 8px rgba(0, 0, 0, 0.14),
                0 8px 20px rgba(15, 23, 42, 0.16),
                0 0 0 1.5px var(--wheel-ring);
            --wheel-label: #747b87;
            --wheel-label-active: #111827;
            --center-bg: linear-gradient(145deg, #cfd3da 0%, #e4e7ec 50%, #f5f6f8 100%);
            --center-shadow:
                inset 0 2px 5px rgba(110, 118, 130, 0.45),
                inset 0 -1px 2px rgba(255, 255, 255, 0.55),
                0 0 0 1.5px var(--wheel-ring);
        }

        [data-lcd-theme="amber"] {
            --lcd-bg: #d99b38;
            --lcd-bg-dark: #c48625;
            --lcd-ink: #241404;
            --lcd-line: rgba(36, 20, 4, 0.32);
            --lcd-ghost: rgba(36, 20, 4, 0.09);
            --lcd-grid: rgba(36, 20, 4, 0.05);
        }

        [data-lcd-theme="blue"] {
            --lcd-bg: #8eb4c9;
            --lcd-bg-dark: #789fb5;
            --lcd-ink: #0c1d29;
            --lcd-line: rgba(12, 29, 41, 0.32);
            --lcd-ghost: rgba(12, 29, 41, 0.09);
            --lcd-grid: rgba(12, 29, 41, 0.05);
        }

        [data-lcd-theme="silver"] {
            --lcd-bg: #c6cbc4;
            --lcd-bg-dark: #b3b9b1;
            --lcd-ink: #161816;
            --lcd-line: rgba(22, 24, 22, 0.32);
            --lcd-ghost: rgba(22, 24, 22, 0.08);
            --lcd-grid: rgba(22, 24, 22, 0.045);
        }

        /* Mode Malam: iPod Classic Black Anodized Elegan */
        body[data-night-mode="true"] {
            --body-outer: #070709;
            --chassis-bg:
                repeating-linear-gradient(
                    90deg,
                    rgba(255, 255, 255, 0.018) 0px,
                    rgba(255, 255, 255, 0.018) 1px,
                    rgba(0, 0, 0, 0.25) 1px,
                    rgba(0, 0, 0, 0.25) 2px
                ),
                radial-gradient(circle at 50% 18%, #222227 0%, #121215 48%, #070709 100%);
            --bezel-bg: linear-gradient(145deg, #16161a 0%, #09090b 100%);
            --bezel-shadow:
                inset 0 3px 10px rgba(0, 0, 0, 0.95),
                0 1px 0 rgba(255, 255, 255, 0.08),
                0 10px 26px rgba(0, 0, 0, 0.75),
                0 0 0 1px rgba(255, 255, 255, 0.11);
            --wheel-bg: radial-gradient(circle at 50% 36%, #28282e 0%, #1a1a1f 62%, #111114 100%);
            --wheel-ring: #383842;
            --wheel-shadow:
                inset 0 1.5px 3px rgba(255, 255, 255, 0.09),
                inset 0 -5px 10px rgba(0, 0, 0, 0.75),
                0 12px 28px rgba(0, 0, 0, 0.8),
                0 0 0 1.5px var(--wheel-ring);
            --wheel-label: #a1a1aa;
            --wheel-label-active: #ffffff;
            --center-bg: radial-gradient(circle at 50% 35%, #26262c 0%, #17171b 65%, #0e0e11 100%);
            --center-shadow:
                inset 0 2px 6px rgba(0, 0, 0, 0.85),
                inset 0 -1px 2px rgba(255, 255, 255, 0.08),
                0 0 0 1.5px #34343d;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            overscroll-behavior: none;
            touch-action: none;
            font-family: 'Share Tech Mono', monospace;
            background-color: var(--body-outer);
            transition: background-color 0.4s ease;
        }

        .ipod-fullscreen-chassis {
            width: 100%;
            height: 100%;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding-top: max(28px, calc(env(safe-area-inset-top) + 14px));
            padding-right: max(18px, calc(env(safe-area-inset-right) + 14px));
            padding-bottom: max(22px, calc(env(safe-area-inset-bottom) + 14px));
            padding-left: max(18px, calc(env(safe-area-inset-left) + 14px));
            background: var(--chassis-bg);
            position: relative;
            transition: background 0.4s ease;
        }

        body.screensaver-mode .ipod-fullscreen-chassis {
            background: #030304;
        }

        .calculator-lcd-frame {
            width: 100%;
            max-width: 680px;
            height: 44vh;
            height: 44dvh;
            min-height: 228px;
            max-height: 375px;
            background: var(--bezel-bg);
            border-radius: 14px;
            padding: clamp(8px, 1.3vh, 12px);
            box-shadow: var(--bezel-shadow);
            display: flex;
            flex-direction: column;
            position: relative;
            transition: background 0.4s ease, box-shadow 0.4s ease;
        }

        body.screensaver-mode .calculator-lcd-frame {
            box-shadow:
                inset 0 3px 8px rgba(0, 0, 0, 0.95),
                0 0 0 1px #141416;
        }

        .lcd-panel {
            width: 100%;
            height: 100%;
            background-color: var(--lcd-bg);
            background-image:
                linear-gradient(to right, var(--lcd-grid) 1px, transparent 1px),
                linear-gradient(to bottom, var(--lcd-grid) 1px, transparent 1px),
                radial-gradient(circle at 50% 45%, var(--lcd-bg) 40%, var(--lcd-bg-dark) 100%);
            background-size: 3px 3px, 3px 3px, 100% 100%;
            border-radius: 6px;
            box-shadow:
                inset 0 4px 12px rgba(0, 0, 0, 0.42),
                inset 0 0 2px rgba(0, 0, 0, 0.55);
            color: var(--lcd-ink);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        .lcd-panel::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(118deg, rgba(255, 255, 255, 0.14) 0%, rgba(255, 255, 255, 0.03) 36%, transparent 38%);
            pointer-events: none;
            z-index: 20;
        }

        .font-calc-digit {
            font-family: 'Orbitron', 'Share Tech Mono', monospace;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.06em;
        }

        .font-calc-matrix {
            font-family: 'VT323', 'Share Tech Mono', monospace;
            letter-spacing: 0.04em;
        }

        .lcd-status-bar {
            height: 28px;
            min-height: 28px;
            max-height: 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            padding: 0 10px;
            border-bottom: 1.5px solid var(--lcd-ink);
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            flex-shrink: 0;
        }

        .lcd-status-left {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
            white-space: nowrap;
        }

        .lcd-status-title {
            flex: 1;
            min-width: 0;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .lcd-status-right {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
            white-space: nowrap;
        }

        .lcd-footer-bar {
            height: 20px;
            min-height: 20px;
            max-height: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
            border-top: 1px solid var(--lcd-line);
            font-size: 10px;
            opacity: 0.85;
            white-space: nowrap;
            overflow: hidden;
            flex-shrink: 0;
        }

        .lcd-divider-b {
            border-bottom: 1px solid var(--lcd-line);
        }

        .lcd-divider-t {
            border-top: 1px solid var(--lcd-line);
        }

        .lcd-box-border {
            border: 1px solid var(--lcd-line);
        }

        .lcd-badge {
            border: 1px solid var(--lcd-ink);
            padding: 0 4px;
            height: 15px;
            font-size: 8.5px;
            line-height: 13px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 2px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .lcd-badge.ghost {
            border-color: var(--lcd-ghost);
            color: var(--lcd-ghost);
        }

        .lcd-toast {
            position: absolute;
            left: 50%;
            bottom: 26px;
            transform: translateX(-50%);
            background-color: var(--lcd-ink);
            color: var(--lcd-bg);
            border: 1.5px solid var(--lcd-bg);
            padding: 4px 10px;
            font-family: 'Orbitron', sans-serif;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.06em;
            white-space: nowrap;
            z-index: 30;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
            pointer-events: none;
        }

        .calc-menu-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: clamp(5px, 0.95vh, 8px) 10px;
            border-bottom: 1px dashed var(--lcd-ghost);
            font-family: 'VT323', monospace;
            font-size: clamp(20px, 2.8vh, 25px);
            line-height: 1.12;
            cursor: pointer;
            min-width: 0;
        }

        .calc-menu-row.active {
            background-color: var(--lcd-ink);
            color: var(--lcd-bg);
        }

        .calc-menu-label-wrap {
            flex: 1;
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 6px;
            overflow: hidden;
        }

        .calc-menu-text {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .wheel-stage {
            flex: 1;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 0;
        }

        .click-wheel {
            width: clamp(216px, 34vh, 292px);
            height: clamp(216px, 34vh, 292px);
            border-radius: 50%;
            background: var(--wheel-bg);
            box-shadow: var(--wheel-shadow);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            cursor: grab;
            transition: background 0.4s ease, box-shadow 0.4s ease;
        }

        .click-wheel:active {
            cursor: grabbing;
        }

        body.screensaver-mode .click-wheel {
            background: #060607;
            box-shadow:
                inset 0 1px 2px rgba(255, 255, 255, 0.03),
                0 0 0 1px #121215;
            transition: background 0.45s ease, box-shadow 0.45s ease;
        }

        body.screensaver-mode .wheel-btn {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .wheel-btn {
            position: absolute;
            color: var(--wheel-label);
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: clamp(10px, 1.5vh, 13px);
            letter-spacing: 1.3px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 72px;
            height: 46px;
            cursor: pointer;
            transition: opacity 0.3s ease, color 0.18s ease, transform 0.1s ease;
            z-index: 3;
        }

        .wheel-btn:active {
            color: var(--wheel-label-active);
        }

        .btn-menu { top: 13px; left: 50%; transform: translateX(-50%); }
        .btn-menu:active { transform: translateX(-50%) scale(0.93); }

        .btn-next { right: 11px; top: 50%; transform: translateY(-50%); }
        .btn-next:active { transform: translateY(-50%) scale(0.93); }

        .btn-prev { left: 11px; top: 50%; transform: translateY(-50%); }
        .btn-prev:active { transform: translateY(-50%) scale(0.93); }

        .btn-play { bottom: 13px; left: 50%; transform: translateX(-50%); }
        .btn-play:active { transform: translateX(-50%) scale(0.93); }

        .center-button {
            width: 36.5%;
            height: 36.5%;
            border-radius: 50%;
            background:
                repeating-linear-gradient(
                    90deg,
                    rgba(255, 255, 255, 0.04) 0px,
                    rgba(255, 255, 255, 0.04) 1px,
                    rgba(0, 0, 0, 0.04) 1px,
                    rgba(0, 0, 0, 0.04) 2px
                ),
                var(--center-bg);
            box-shadow: var(--center-shadow);
            cursor: pointer;
            transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.4s ease;
            z-index: 5;
        }

        .center-button:active {
            transform: scale(0.95);
            box-shadow:
                inset 0 4px 9px rgba(0, 0, 0, 0.75),
                0 0 0 1.5px var(--wheel-ring);
        }

        body.screensaver-mode .center-button {
            background: #08080a;
            box-shadow:
                inset 0 1px 2px rgba(255, 255, 255, 0.02),
                0 0 0 1px #141418;
            transition: background 0.45s ease, box-shadow 0.45s ease;
        }

        .calc-bar-container {
            display: grid;
            grid-template-columns: repeat(20, 1fr);
            gap: 2px;
            padding: 2px;
            border: 1.5px solid var(--lcd-ink);
            height: 14px;
        }

        .calc-bar-cell {
            background-color: var(--lcd-ghost);
            height: 100%;
        }

        .calc-bar-cell.filled {
            background-color: var(--lcd-ink);
        }

        .digit-stack {
            position: relative;
            display: inline-block;
        }
        .digit-ghost {
            color: var(--lcd-ghost);
            user-select: none;
        }
        .digit-active {
            position: absolute;
            top: 0;
            right: 0;
            color: var(--lcd-ink);
        }

        .nokia-reader-shell {
            flex: 1;
            height: 100%;
            min-height: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 6px 10px;
            overflow: hidden;
        }

        .nokia-reader-header {
            height: 22px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--lcd-line);
            margin-bottom: 4px;
        }

        .nokia-reader-body-slot {
            flex: 1;
            min-height: 0;
            overflow: hidden;
            display: flex;
            align-items: flex-start;
        }

        .nokia-page-body {
            font-family: 'Share Tech Mono', 'VT323', monospace;
            font-size: clamp(12px, 1.75vh, 14px);
            line-height: 1.3;
            white-space: pre-wrap;
            word-break: break-word;
            overflow: hidden;
            width: 100%;
        }

        .nokia-reader-footer {
            height: 18px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid var(--lcd-line);
            margin-top: 4px;
        }

        @media (orientation: landscape) and (max-height: 500px) {
            .ipod-fullscreen-chassis {
                flex-direction: row;
                justify-content: space-evenly;
                padding-top: 12px;
                padding-bottom: 12px;
            }
            .calculator-lcd-frame {
                width: 52vw;
                height: 84dvh;
                max-height: none;
            }
            .wheel-stage {
                width: 40vw;
            }
            .click-wheel {
                width: min(74dvh, 250px);
                height: min(74dvh, 250px);
            }
        }
    </style>
</head>
<body data-lcd-theme="olive" data-night-mode="false">

    <input type="file" id="audioUploadInput" accept="audio/*,.mp3,.wav,.m4a,.ogg,.aac,.flac" multiple style="display:none;">

    <main class="ipod-fullscreen-chassis">

        <section class="calculator-lcd-frame">
            <div class="lcd-panel" id="lcdPanel">
                <div class="lcd-status-bar">
                    <div class="lcd-status-left">
                        <span id="badgePlay" class="lcd-badge">SIAP</span>
                        <span id="badgeHold" class="lcd-badge ghost">HOLD</span>
                        <span id="badgeShuffle" class="lcd-badge ghost">SHFL</span>
                        <span id="badgeRepeat" class="lcd-badge ghost">RPT</span>
                    </div>

                    <div id="lcdHeaderTitle" class="lcd-status-title font-calc-digit text-xs sm:text-sm font-bold uppercase tracking-wider">
                        MENU UTAMA
                    </div>

                    <div class="lcd-status-right">
                        <span id="lcdVolIndicator" class="font-calc-digit text-[10px] sm:text-xs">VOL:80</span>
                        <div class="flex items-center shrink-0">
                            <div class="flex gap-[1px] border border-current p-[1px] h-3">
                                <div class="w-1 h-full bg-current"></div>
                                <div class="w-1 h-full bg-current"></div>
                                <div class="w-1 h-full bg-current"></div>
                                <div class="w-1 h-full bg-current"></div>
                            </div>
                            <div class="w-[2px] h-1.5 bg-current"></div>
                        </div>
                    </div>
                </div>

                <div id="lcdScreenBody" class="flex-1 flex flex-col overflow-hidden relative"></div>

                <div id="lcdToast" class="lcd-toast hidden"></div>

                <div class="lcd-footer-bar font-calc-digit">
                    <span id="lcdFooterLeft">[WHEEL] GULIR</span>
                    <span id="lcdTrackCounter">TRK 00/01</span>
                    <span id="lcdFooterRight">[TENGAH] PILIH</span>
                </div>
            </div>
        </section>

        <section class="wheel-stage">
            <div class="click-wheel" id="clickWheel">
                <div class="wheel-btn btn-menu" id="btnMenu">MENU</div>

                <div class="wheel-btn btn-next" id="btnNext" aria-label="Lagu Berikutnya">
                    <svg width="18" height="14" viewBox="0 0 24 16" fill="currentColor">
                        <polygon points="0,0 10,8 0,16"/>
                        <polygon points="10,0 20,8 10,16"/>
                        <rect x="20" y="0" width="3" height="16"/>
                    </svg>
                </div>

                <div class="wheel-btn btn-prev" id="btnPrev" aria-label="Lagu Sebelumnya">
                    <svg width="18" height="14" viewBox="0 0 24 16" fill="currentColor">
                        <rect x="1" y="0" width="3" height="16"/>
                        <polygon points="14,0 4,8 14,16"/>
                        <polygon points="24,0 14,8 24,16"/>
                    </svg>
                </div>

                <div class="wheel-btn btn-play" id="btnPlay" aria-label="Putar atau Jeda">
                    <svg width="20" height="14" viewBox="0 0 26 16" fill="currentColor">
                        <polygon points="1,0 11,8 1,16"/>
                        <rect x="15" y="1" width="3.5" height="14"/>
                        <rect x="21" y="1" width="3.5" height="14"/>
                    </svg>
                </div>

                <div class="center-button" id="btnSelect" aria-label="Pilih"></div>
            </div>
        </section>

    </main>

    <script>
        const STORAGE_KEY = 'ipod_calc_state_v2';

        const SUPABASE_CONFIG = {
            url: 'https://awlxjzfadktcthbumxle.supabase.co',
            key: 'sb_publishable_LnE9IH5KKDzdV-gj9tIb6w_uOGVZi4o',
            bucket: 'documents',
            folder: 'uploads'
        };

        function triggerHaptic(pattern = 8) {
            try {
                if (typeof navigator !== 'undefined' && typeof navigator.vibrate === 'function') {
                    navigator.vibrate(pattern);
                }
            } catch (e) {}
        }

        let supabaseClient = null;
        try {
            if (window.supabase && typeof window.supabase.createClient === 'function') {
                supabaseClient = window.supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.key, {
                    auth: { persistSession: false, autoRefreshToken: false }
                });
            }
        } catch (err) {
            console.warn('Inisialisasi Supabase gagal, memakai mode lokal:', err);

            connected: false,
            statusLabel: 'LOKAL',
            uploadStatus: 'PILIH',

        function extractNewestTimestamp(row) {
            if (!row || typeof row !== 'object') return NaN;
            if (row.created_at) {
                const t = Date.parse(row.created_at);
                if (!Number.isNaN(t)) return t;
            }
            if (row.reminder_date) {
                const timePart = row.reminder_time ? String(row.reminder_time).substring(0, 8) : '00:00:00';
                const t = Date.parse(`${row.reminder_date}T${timePart}`);
                if (!Number.isNaN(t)) return t;
            }
            return NaN;
        }

        function sortNewestFirst(rows) {
            if (!Array.isArray(rows)) return [];
            return [...rows].sort((a, b) => {
                const ta = extractNewestTimestamp(a);
                const tb = extractNewestTimestamp(b);
                if (!Number.isNaN(ta) && !Number.isNaN(tb) && ta !== tb) {
                    return tb - ta;
                }
                const ida = Number(a?.id);
                const idb = Number(b?.id);
                if (!Number.isNaN(ida) && !Number.isNaN(idb) && ida !== idb) {
                    return idb - ida;
                }
                return String(b?.id ?? '').localeCompare(String(a?.id ?? ''));
            });
        }

        function parseTrackMetadata(rawName, folderName = 'UTAMA') {
            if (!rawName) {
                return { title: 'BERKAS TANPA NAMA', artist: 'SUPABASE STORAGE', folder: folderName };
            }
            const clean = rawName
                .replace(/^\d+_/, '')
                .replace(/\.[^/.]+$/, '')
                .replace(/_/g, ' ')
                .trim();

            const dashMatch = clean.match(/^(.+?)\s+-\s+(.+)$/);
            if (dashMatch) {
                return {
                    artist: dashMatch[1].trim().toUpperCase(),
                    title: dashMatch[2].trim().toUpperCase(),
                    folder: folderName.toUpperCase()
                };
            }

            return {
                title: clean.replace(/-/g, ' ').trim().toUpperCase() || rawName.toUpperCase(),
                artist: folderName !== 'UTAMA' ? `FOLDER ${folderName.toUpperCase()}` : 'SUPABASE STORAGE',
                folder: folderName.toUpperCase()
            };
        }

        function sanitizeUploadFilename(originalName) {
            const parts = originalName.split('.');
            const ext = parts.length > 1 ? parts.pop().toLowerCase().replace(/[^a-z0-9]/g, '') : 'mp3';
            const base = parts.join('.')
                .replace(/[^\w\s-]/g, '')
                .trim()
                .replace(/\s+/g, '_');
            const safeBase = base || `lagu_${Date.now()}`;
            return `${safeBase}.${ext || 'mp3'}`;
        }

        class CalculatorSynthEngine {
            constructor() {
                this.ctx = null;
                this.masterGain = null;
                this.analyser = null;
                this.freqData = null;
                this.mediaSourceConnected = false;
                this.corsAnalyserBlocked = false;

                this.audioEl = new Audio();
                this.audioEl.crossOrigin = 'anonymous';
                this.audioEl.preload = 'metadata';

                this.volume = 0.8;
                this.clickEnabled = true;
                this.isPlaying = false;
                this.currentSong = null;
                this.elapsed = 0;
                this.stepIndex = 0;
                this.progressTimer = null;
                this.spectrumLevels = [2, 4, 6, 3, 7, 5, 4, 2];
                this.onTick = null;
                this.onSongFinish = null;
                this.onTimeSave = null;
                this._pendingSeekTarget = null;

                this.bindAudioElementEvents();
            }

            bindAudioElementEvents() {
                this.audioEl.addEventListener('loadedmetadata', () => {
                    if (this.currentSong && Number.isFinite(this.audioEl.duration) && this.audioEl.duration > 0) {
                        this.currentSong.duration = Math.round(this.audioEl.duration);
                        if (this._pendingSeekTarget !== null && this._pendingSeekTarget > 0 && this._pendingSeekTarget < this.audioEl.duration) {
                            try { this.audioEl.currentTime = this._pendingSeekTarget; } catch (e) {}
                        }
                        this._pendingSeekTarget = null;
                        if (this.onTick) this.onTick();
                    }
                });

                this.audioEl.addEventListener('timeupdate', () => {
                    if (this.isPlaying && this.currentSong) {
                        this.elapsed = this.audioEl.currentTime || 0;
                        this.updateSpectrum();
                    }
                });

                this.audioEl.addEventListener('error', () => {
                    if (this.isPlaying) {
                        this.isPlaying = false;
                        this.stopProgressTimer();
                        if (this.onTick) this.onTick();
                    }
                });

                this.audioEl.addEventListener('ended', () => {
                    this.elapsed = 0;
                    if (this.onSongFinish) this.onSongFinish();
                });
            }

            ensureContext() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioCtx();
                    this.masterGain = this.ctx.createGain();
                    this.masterGain.gain.setValueAtTime(this.volume, this.ctx.currentTime);
                    this.masterGain.connect(this.ctx.destination);
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume().catch(() => {});
                }
            }

            setupAnalyser() {
                if (this.mediaSourceConnected || this.corsAnalyserBlocked) return;
                try {
                    this.ensureContext();
                    const src = this.ctx.createMediaElementSource(this.audioEl);
                    this.analyser = this.ctx.createAnalyser();
                    this.analyser.fftSize = 64;
                    this.analyser.smoothingTimeConstant = 0.72;
                    this.freqData = new Uint8Array(this.analyser.frequencyBinCount);
                    src.connect(this.analyser);
                    this.analyser.connect(this.ctx.destination);
                    this.mediaSourceConnected = true;
                } catch (err) {
                    this.corsAnalyserBlocked = true;
                }
            }

            setVolume(val) {
                this.volume = Math.max(0, Math.min(1, Number(val.toFixed(2))));
                if (this.audioEl) {
                    this.audioEl.volume = this.volume;
                }
                if (this.masterGain && this.ctx) {
                    this.masterGain.gain.setTargetAtTime(this.volume, this.ctx.currentTime, 0.02);
                }
            }

            playClick(pitch = 1.0, type = 'wheel') {
                if (!this.clickEnabled) return;
                try {
                    this.ensureContext();
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    if (type === 'enter') {
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(980, now);
                        osc.frequency.exponentialRampToValueAtTime(1420, now + 0.022);
                        gain.gain.setValueAtTime(0.2, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.024);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(now);
                        osc.stop(now + 0.025);
                        return;
                    }

                    if (type === 'back') {
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(1120, now);
                        osc.frequency.exponentialRampToValueAtTime(520, now + 0.022);
                        gain.gain.setValueAtTime(0.19, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.024);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(now);
                        osc.stop(now + 0.025);
                        return;
                    }

                    if (type === 'wake') {
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(660, now);
                        osc.frequency.exponentialRampToValueAtTime(1320, now + 0.03);
                        gain.gain.setValueAtTime(0.1, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.032);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(now);
                        osc.stop(now + 0.035);
                        return;
                    }

                    if (type === 'sleep') {
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(880, now);
                        osc.frequency.exponentialRampToValueAtTime(340, now + 0.035);
                        gain.gain.setValueAtTime(0.08, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.038);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(now);
                        osc.stop(now + 0.04);
                        return;
                    }

                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(1250 * pitch, now);
                    osc.frequency.exponentialRampToValueAtTime(190 * pitch, now + 0.013);

                    gain.gain.setValueAtTime(0.22, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.014);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(now);
                    osc.stop(now + 0.015);
                } catch (e) {}
            }

            updateSpectrum() {
                this.stepIndex++;
                if (this.analyser && this.freqData && !this.corsAnalyserBlocked) {
                    this.analyser.getByteFrequencyData(this.freqData);
                    let sum = 0;
                    for (let i = 0; i < 16; i++) sum += this.freqData[i];
                    if (sum > 0) {
                        const bins = [1, 2, 4, 6, 8, 11, 14, 18];
                        this.spectrumLevels = bins.map(b => {
                            const val = this.freqData[b] || 0;
                            return Math.max(1, Math.min(8, Math.round((val / 255) * 8)));
                        });
                        if (this.onTick) this.onTick();
                        return;
                    }
                }

                this.spectrumLevels = this.spectrumLevels.map((_, i) => {
                    const wave = Math.abs(Math.sin((this.stepIndex + i * 1.35) * 0.8));
                    return Math.max(1, Math.min(8, Math.round(wave * 8)));
                });
                if (this.onTick) this.onTick();
            }

            stopProgressTimer() {
                if (this.progressTimer) {
                    clearInterval(this.progressTimer);
                    this.progressTimer = null;
                }
            }

            startProgressTimer() {
                this.stopProgressTimer();
                let saveCounter = 0;
                this.progressTimer = setInterval(() => {
                    if (!this.isPlaying || !this.currentSong) return;
                    if (Number.isFinite(this.audioEl.currentTime) && this.audioEl.currentTime > 0) {
                        this.elapsed = this.audioEl.currentTime;
                    } else {
                        this.elapsed += 0.25;
                    }
                    saveCounter++;
                    if (saveCounter >= 8 && this.onTimeSave) {
                        saveCounter = 0;
                        this.onTimeSave();
                    }
                    if (this.currentSong.duration > 0 && this.elapsed >= this.currentSong.duration) {
                        this.elapsed = 0;
                        if (this.onSongFinish) this.onSongFinish();
                    } else if (this.onTick) {
                        this.onTick();
                    }
                }, 250);
            }

            seekBy(deltaSec) {
                if (!this.currentSong) return;
                const dur = Number.isFinite(this.audioEl.duration) && this.audioEl.duration > 0
                    ? this.audioEl.duration
                    : (this.currentSong.duration || 0);
                const maxTime = dur > 0 ? dur : Math.max(0, this.elapsed + deltaSec);
                const target = Math.max(0, Math.min(maxTime, this.elapsed + deltaSec));
                this.elapsed = target;
                try {
                    if (Number.isFinite(target)) {
                        this.audioEl.currentTime = target;
                    }
                } catch (e) {}
                if (this.onTimeSave) this.onTimeSave();
                if (this.onTick) this.onTick();
            }

            loadSongWithoutPlay(song, startPos = 0) {
                this.stopProgressTimer();
                this.audioEl.pause();
                this.currentSong = song || null;
                this.elapsed = Math.max(0, startPos || 0);
                this._pendingSeekTarget = this.elapsed > 0 ? this.elapsed : null;
                this.stepIndex = 0;
                this.isPlaying = false;
                this.audioEl.volume = this.volume;

                if (song && song.audioUrl) {
                    this.audioEl.src = song.audioUrl;
                } else {
                    this.audioEl.removeAttribute('src');
                }
            }

            playSong(song, startPos = 0) {
                this.stopProgressTimer();
                this.audioEl.pause();
                this.currentSong = song || null;
                this.elapsed = Math.max(0, startPos || 0);
                this._pendingSeekTarget = this.elapsed > 0 ? this.elapsed : null;
                this.stepIndex = 0;
                this.audioEl.volume = this.volume;

                if (!song || !song.audioUrl) {
                    this.isPlaying = false;
                    this.audioEl.removeAttribute('src');
                    return;
                }

                this.setupAnalyser();
                this.isPlaying = true;
                this.audioEl.src = song.audioUrl;

                const playPromise = this.audioEl.play();
                if (playPromise && typeof playPromise.catch === 'function') {
                    playPromise.catch(() => {
                        if (this.currentSong === song) {
                            this.isPlaying = false;
                            this.stopProgressTimer();
                            if (this.onTick) this.onTick();
                        }
                    });
                }
                this.startProgressTimer();
            }

            togglePlayPause() {
                if (!this.currentSong || !this.currentSong.audioUrl) return false;

                if (this.isPlaying) {
                    this.isPlaying = false;
                    this.stopProgressTimer();
                    this.audioEl.pause();
                } else {
                    this.setupAnalyser();
                    this.isPlaying = true;
                    this.audioEl.play().catch(() => {
                        this.isPlaying = false;
                        this.stopProgressTimer();
                        if (this.onTick) this.onTick();
                    });
                    this.startProgressTimer();
                }
                return this.isPlaying;
            }
        }

        const synth = new CalculatorSynthEngine();

        const LCD_THEMES = ['olive', 'amber', 'blue', 'silver'];
        const THEME_NAMES = {
            olive: 'HIJAU-LCD',
            amber: 'AMBER-EL',
            blue: 'BIRU-DINGIN',

        const REPEAT_MODES = ['off', 'all', 'one'];

        };

        const state = {

            savedElapsed: 0,

        function savePersistentState() {
            try {
                const payload = {
                    themeIndex: state.themeIndex,
                    nightMode: state.nightMode,
                    shuffle: state.shuffle,
                    repeatMode: state.repeatMode,
                    clickEnabled: synth.clickEnabled,
                    volume: synth.volume,
                    savedTrackId: synth.currentSong ? synth.currentSong.id : state.savedTrackId,
                    savedElapsed: Math.floor(synth.elapsed || 0)
                };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
            } catch (e) {}
        }

        function loadPersistentState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return;
                const data = JSON.parse(raw);
                if (typeof data.themeIndex === 'number' && LCD_THEMES[data.themeIndex]) {
                    state.themeIndex = data.themeIndex;
                    document.body.setAttribute('data-lcd-theme', LCD_THEMES[state.themeIndex]);
                }
                if (typeof data.nightMode === 'boolean') {
                    state.nightMode = data.nightMode;
                    document.body.setAttribute('data-night-mode', state.nightMode ? 'true' : 'false');
                }
                if (typeof data.shuffle === 'boolean') state.shuffle = data.shuffle;
                if (REPEAT_MODES.includes(data.repeatMode)) state.repeatMode = data.repeatMode;
                if (typeof data.clickEnabled === 'boolean') synth.clickEnabled = data.clickEnabled;
                if (typeof data.volume === 'number') synth.setVolume(data.volume);
                if (typeof data.savedTrackId === 'string') state.savedTrackId = data.savedTrackId;
                if (typeof data.savedElapsed === 'number') state.savedElapsed = data.savedElapsed;
            } catch (e) {}
        }

        synth.onTimeSave = savePersistentState;

        function getAllTracks() {
            return [...supabaseStore.cloudTracks, ...supabaseStore.localTracks];

        const audioUploadInputEl = document.getElementById('audioUploadInput');

        function triggerPhoneAudioPicker() {
            if (supabaseStore.isUploading) {
                showLCDToast('SEDANG MENGUNGGAH...', 1200);
                return;
            }
            if (!audioUploadInputEl) return;
            audioUploadInputEl.value = '';
            audioUploadInputEl.click();
